name: Bootstrap reproducible dependency lockfiles

on:
  push:
    branches:
      - codex/mawda-full-platform-implementation
    paths:
      - "pubspec.yaml"
      - "functions/package.json"
      - ".github/workflows/bootstrap-dependency-locks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mawda-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate-and-commit-lockfiles:
    if: github.ref == 'refs/heads/codex/mawda-full-platform-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mawda-full-platform-implementation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Generate Flutter dependency lock
        run: flutter pub get
      - name: Generate Cloud Functions dependency lock
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "chore: add reproducible dependency lockfiles"
          git push origin "HEAD:codex/mawda-full-platform-implementation"
