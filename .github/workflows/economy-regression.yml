name: Mawdda economy regression

on:
  push:
    branches:
      - codex/mawda-full-platform-implementation
    paths:
      - "functions/**"
      - "lib/screens/economy_pricing_screen.dart"
      - ".github/workflows/economy-regression.yml"
  pull_request:
    branches:
      - codex/mawda-full-platform-implementation
    paths:
      - "functions/**"
      - "lib/screens/economy_pricing_screen.dart"
      - ".github/workflows/economy-regression.yml"

permissions:
  contents: read

concurrency:
  group: mawdda-economy-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economy-unit:
    name: Compile Cloud Functions and run all unit regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile and run complete backend unit suite
        run: npm test

  economy-emulator:
    name: Wallet, entitlement, featured-ad and store emulator regressions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile Functions before emulator tests
        run: npm run build
      - name: Run wallet and store atomicity regressions
        run: npm run test:wallet-store-integration
      - name: Run owner entitlement grant and replay regressions
        run: npm run test:owner-entitlement-grants-integration
      - name: Run featured-ad reward policy regressions
        run: npm run test:featured-ad-finance-integration
      - name: Run store catalog regressions
        run: npm run test:store-gifting-integration
      - name: Run room-rental wallet and replay regressions
        run: npm run test:room-rental-integration
      - name: Run email verification reward-cycle regressions
        run: npm run test:email-renewal-integration
      - name: Run engagement reward regressions
        run: npm run test:engagement-rewards-integration
      - name: Run call entitlement and lifecycle regressions
        run: npm run test:call-signaling-integration
      - name: Run owner audit-chain export regressions
        run: npm run test:owner-audit-export-integration
      - name: Run Firestore and Storage security rules regressions
        run: npm run test:rules
