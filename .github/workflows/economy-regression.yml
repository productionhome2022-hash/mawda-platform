name: Mawdda economy regression

on:
  push:
    branches:
      - codex/economy-recovery-2026-11-18
    paths:
      - "functions/**"
      - "lib/screens/economy_pricing_screen.dart"
      - ".github/workflows/economy-regression.yml"
  pull_request:
    branches:
      - codex/economy-recovery-2026-11-18
    paths:
      - "functions/**"
      - "lib/screens/economy_pricing_screen.dart"
      - ".github/workflows/economy-regression.yml"

permissions:
  contents: read

concurrency:
  group: mawdda-economy-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economy-unit:
    name: Compile Cloud Functions and run all unit regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile and run complete backend unit suite
        run: npm test

  economy-emulator:
    name: Wallet, entitlement, featured-ad and store emulator regressions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run wallet and store atomicity regressions
        run: npm run test:wallet-store-integration
      - name: Run owner entitlement grant and replay regressions
        run: npm run test:owner-entitlement-grants-integration
      - name: Run featured-ad reward policy regressions
        run: npm run test:featured-ad-reward-policy-integration
      - name: Run store catalog regressions
        run: npm run test:store-catalog-integration
