name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web
        run: |
          if [ -d "mawda_app" ]; then cd mawda_app; fi
          flutter pub get
          flutter build web --release

      - name: Locate Build Dir
        id: set-path
        run: |
          if [ -d "mawda_app/build/web" ]; then
            echo "path=mawda_app/build/web" >> $GITHUB_OUTPUT
          else
            echo "path=build/web" >> $GITHUB_OUTPUT
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAWDA_APP_2026 }}'
          channelId: live
          projectId: mawda-app-2026
