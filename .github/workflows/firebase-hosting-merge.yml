name: Build and Deploy to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Explicitly approve deployment of the validated main branch to production Firebase Hosting"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Web Release
        run: flutter build web --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: functions

      - name: Compile and test backend
        run: npm test
        working-directory: functions

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Firestore and Storage rules emulator tests
        run: npm run test:rules
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
