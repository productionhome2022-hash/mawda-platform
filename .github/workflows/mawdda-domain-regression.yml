name: Mawdda domain regression

on:
  # Overlaps the staged Validate Mawda pipeline; retain manual targeted runs only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mawdda-domain-regression-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  backend-domain-regression:
    name: Retention and room reservation emulator regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile and run backend unit tests
        run: npm test
      - name: Run mode-aware chat retention integration tests
        run: npm run test:retention-integration
      - name: Run room event seat reservation and cancellation integration tests
        run: npm run test:room-events-integration
      - name: Run owner entitlement grant and bulk replay integration tests
        run: npm run test:owner-entitlement-grants-integration
      - name: Run specialized role capacity and concurrency integration tests
        run: npm run test:specialized-role-capacity-integration
      - name: Run store gifting wallet and entitlement integration tests
        run: npm run test:store-gifting-integration
      - name: Run voice and video call lifecycle integration tests
        run: npm run test:call-signaling-integration
      - name: Run timed advertising and reward ledger integration tests
        run: npm run test:engagement-rewards-integration

  flutter-domain-regression:
    name: Flutter UI analysis and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze
      - name: Run Flutter widget and unit tests
        run: flutter test
