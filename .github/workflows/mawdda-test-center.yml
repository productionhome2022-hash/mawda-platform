name: Mawdda Test Center

on:
  # Manual, emulator-only full validation remains available when GitHub exposes
  # workflow_dispatch from the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mawdda-test-center-${{ github.ref_name }}
  # A newer commit supersedes an older queued/running full-suite attempt.
  cancel-in-progress: true

jobs:
  flutter-validation:
    name: Flutter analysis, tests and web release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Verify this run targets the isolated development branch
        run: |
          test "${GITHUB_REF_NAME}" = "codex/mawda-full-platform-implementation"
      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build release web artifact
        env:
          MAWDA_APP_CHECK_WEB_SITE_KEY: ${{ vars.MAWDA_NONPROD_APP_CHECK_WEB_SITE_KEY }}
        run: |
          flutter build web --release \
            --dart-define=MAWDDA_APP_CHECK_WEB_SITE_KEY="$MAWDA_APP_CHECK_WEB_SITE_KEY"
      - name: Upload validated Web build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mawdda-test-center-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  backend-emulator-validation:
    name: Backend, Firebase rules and complete emulator journeys
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - name: Verify this run targets the isolated development branch
        run: |
          test "${GITHUB_REF_NAME}" = "codex/mawda-full-platform-implementation"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete emulator-only Test Center suite
        run: npm run test:all
      - name: Upload synthetic persona catalogue (no credentials)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mawdda-test-center-personas-${{ github.sha }}
          path: functions/test/fixtures/test-account-personas.json
          if-no-files-found: error
          retention-days: 7
