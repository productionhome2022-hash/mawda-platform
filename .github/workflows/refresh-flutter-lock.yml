name: Refresh Flutter lockfile

on:
  push:
    branches:
      - codex/mawda-full-platform-implementation
    paths:
      - pubspec.yaml
      - .github/workflows/refresh-flutter-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: codex/mawda-full-platform-implementation
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve and write pubspec.lock
        run: flutter pub get
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mawda-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
