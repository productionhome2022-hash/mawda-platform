name: Validate Mawda

on:
  push:
    branches:
      - main
      - codex/mawda-full-platform-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mawda-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flutter:
    name: Flutter analysis, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Generate and verify Flutter dependency lockfile
        run: |
          flutter pub get
          flutter pub get --enforce-lockfile
      - name: Upload generated Flutter lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mawda-flutter-lockfile-${{ github.sha }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 3
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Upload validated web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawda-web-build-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  functions:
    name: Cloud Functions compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Generate and verify npm dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mawda-functions-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Compile and test backend
        run: npm test
      - name: Upload compiled Cloud Functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawda-cloud-functions-${{ github.sha }}
          path: functions/lib/
          if-no-files-found: error
          retention-days: 7
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Firestore and Storage rules emulator tests
        run: npm run test:rules

  persist-lockfiles:
    name: Persist generated dependency lockfiles
    needs: [flutter, functions]
    if: >-
      always() &&
      needs.flutter.result == 'success' &&
      needs.functions.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Download generated Flutter lockfile
        uses: actions/download-artifact@v4
        with:
          name: mawda-flutter-lockfile-${{ github.sha }}
          path: /tmp/mawda-locks/flutter
      - name: Download generated Functions lockfile
        uses: actions/download-artifact@v4
        with:
          name: mawda-functions-lockfile-${{ github.sha }}
          path: /tmp/mawda-locks/functions
      - name: Commit lockfiles to the pull request branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/mawda-locks/flutter/pubspec.lock pubspec.lock
          cp /tmp/mawda-locks/functions/package-lock.json functions/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already current."
            exit 0
          fi
          git commit -m "chore: commit reproducible dependency lockfiles"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
