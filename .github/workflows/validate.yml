name: Validate Mawda

on:
  push:
    branches:
      - main
      - codex/mawda-full-platform-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mawda-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analysis, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Flutter dependencies from committed lockfile
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Upload validated web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawda-web-build-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  functions:
    name: Cloud Functions compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Cloud Functions dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Compile and test backend
        run: npm test
      - name: Upload compiled Cloud Functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawda-cloud-functions-${{ github.sha }}
          path: functions/lib/
          if-no-files-found: error
          retention-days: 7
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run media callable authorization and audit integration tests
        run: npm run test:media-integration
      - name: Run Firestore and Storage rules emulator tests
        run: npm run test:rules

  scanner:
    name: Isolated ClamAV scanner gateway tests and image build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Validate scanner source and security contracts
        run: |
          node --check scanner/server.js
          node --check scanner/security.js
          sh -n scanner/start.sh
          node --test scanner/test/*.test.js
      - name: Build isolated ClamAV scanner container
        run: docker build --tag mawda-clamav-scanner:ci scanner
