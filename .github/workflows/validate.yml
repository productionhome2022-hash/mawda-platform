name: Validate Mawda

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Push and PR events for the same development branch share one validation lane.
  # This prevents duplicate queued builds and stale commits from cancelling the latest result.
  group: mawda-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analysis, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Flutter dependencies from committed lockfile
        run: flutter pub get --enforce-lockfile
      - name: Upload resolved dependency lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: mawda-pubspec-lock-${{ github.sha }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Upload validated web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawda-web-build-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  functions:
    name: Cloud Functions compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Cloud Functions dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Compile and test backend
        run: npm test
      - name: Syntax-check live non-production scanner E2E script
        run: node --check scripts/test-live-media-scanner-e2e.cjs
      - name: Validate GitHub Actions workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts file }' ../.github/workflows/*.yml
      - name: Upload compiled Cloud Functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawda-cloud-functions-${{ github.sha }}
          path: functions/lib/
          if-no-files-found: error
          retention-days: 7
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run media callable authorization and audit integration tests
        run: npm run test:media-integration
      - name: Run seven-day chat retention integration tests
        run: npm run test:retention-integration
      - name: Run direct-message deletion authorization and erasure integration tests
        run: npm run test:message-deletion-integration
      - name: Run coin transfer and store purchase transactional integration tests
        run: npm run test:wallet-store-integration
      - name: Run safety report and appeal lifecycle integration tests
        run: npm run test:safety-integration
      - name: Run guest and member privacy acknowledgement integration tests
        run: npm run test:guest-privacy-integration
      - name: Run owner audit export pagination and redaction integration tests
        run: npm run test:owner-audit-export-integration
      - name: Run media legal hold and release integration tests
        run: npm run test:media-legal-hold-integration
      - name: Run avatar and cover lifecycle integration tests
        run: npm run test:profile-media-integration
      - name: Run message legal hold and resumed retention integration tests
        run: npm run test:message-legal-hold-integration
      - name: Run Firestore and Storage rules emulator tests
        run: npm run test:rules

  scanner:
    name: Isolated ClamAV scanner gateway tests and image build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Validate scanner source and security contracts
        run: |
          node --check scanner/server.js
          node --check scanner/security.js
          node --check scanner/processors.js
          sh -n scanner/start.sh
          node --test scanner/test/security.test.js scanner/test/processors.test.js
      - name: Build isolated ClamAV scanner container
        run: docker build --tag mawda-clamav-scanner:ci scanner
      - name: Run real GIF, audio, video and PDF sanitization tests inside the scanner image
        run: docker run --rm --entrypoint npm mawda-clamav-scanner:ci test
      - name: Verify ClamAV detects the harmless EICAR test signature
        run: |
          docker run --rm --entrypoint sh mawda-clamav-scanner:ci -c '
            set -eu
            freshclam --stdout --log=/tmp/freshclam.log
            printf '%s' 'WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo=' | base64 -d > /tmp/eicar.com
            set +e
            clamscan --infected --no-summary /tmp/eicar.com
            result=$?
            set -e
            test "$result" -eq 1
          '
