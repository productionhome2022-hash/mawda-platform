<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
    <style>
        :root {
            --bg-dark: #09080b;
            --panel-bg: #131117;
            --gold: #ffd700;
            --gold-hover: #e6c200;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 215, 0, 0.25);
            --primary-blue: #2563eb;
            --danger-red: #dc2626;
            --success-green: #16a34a;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        /* 1. الواجهة الخارجية المستقلة (Landing & Auth Screen) */
        #splashScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at center, #1c1726 0%, #09080b 100%);
            text-align: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            box-sizing: border-box;
        }
        .splash-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .splash-logo { font-size: 55px; margin-bottom: 10px; }
        .splash-title { color: var(--gold); font-size: 19px; font-weight: bold; margin-bottom: 8px; line-height: 1.4; }
        .splash-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 22px; line-height: 1.5; }

        /* النوابض (Modals) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            text-align: right;
            box-sizing: border-box;
        }
        .modal-box h3 { color: var(--gold); margin-top: 0; font-size: 17px; }

        /* 2. التطبيق الرئيسي */
        #mainApp {
            display: none;
            max-width: 950px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .top-header {
            background: rgba(9, 8, 11, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-title {
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            margin: 0;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-controls { display: flex; gap: 6px; align-items: center; }
        .lang-selector {
            background: #1f1b26;
            color: var(--gold);
            border: 1px solid var(--border-color);
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            background: var(--panel-bg);
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .nav-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--border-color);
            padding: 7px 11px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }

        /* 3. بروفايل فيسبوك والوضع المزدوج */
        .fb-profile-container {
            background: var(--panel-bg);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-top: none;
        }
        .fb-cover-photo { height: 210px; background: linear-gradient(135deg, #2b1f3d, #120e17); position: relative; }
        .admin-mode-banner {
            position: absolute; top: 10px; left: 10px;
            background: var(--gold); color: #000; padding: 4px 10px;
            border-radius: 6px; font-weight: bold; font-size: 11px;
            display: none;
        }
        .fb-header-section { padding: 0 20px 20px 20px; position: relative; }
        .fb-avatar-container { position: relative; display: inline-block; margin-top: -70px; margin-left: 20px; }
        .fb-avatar {
            width: 120px; height: 120px; border-radius: 50%;
            border: 4px solid var(--panel-bg); object-fit: cover; background: #2b2735;
            display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--gold);
        }
        .fb-profile-info { display: inline-block; vertical-align: top; margin-top: 10px; }
        .fb-profile-name { font-size: 19px; font-weight: bold; color: var(--text-main); margin: 0; }
        .fb-profile-bio { font-size: 12px; color: var(--text-muted); margin: 5px 0 10px 0; line-height: 1.5; }
        .fb-actions-bar { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .fb-btn {
            background: var(--gold); color: var(--bg-dark); border: none;
            padding: 7px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px;
            display: flex; align-items: center; gap: 5px;
        }
        .fb-btn.secondary { background: #1f1b26; color: var(--text-main); border: 1px solid var(--border-color); }
        .fb-tabs {
            display: flex; gap: 15px; padding: 0 20px; background: var(--panel-bg);
            border-top: 1px solid var(--border-color); font-weight: bold; font-size: 12px;
        }
        .fb-tab-item { padding: 12px 0; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; }
        .fb-tab-item.active { color: var(--gold); border-bottom: 3px solid var(--gold); }

        /* اللوحات والنماذج */
        .card-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 18px; margin: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 15px; }
        .sub-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 15px; text-align: center;
        }
        .sub-card h3 { color: var(--gold); font-size: 15px; margin-bottom: 8px; }
        .sub-card p { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; line-height: 1.5; }
        button.action-btn {
            background: var(--gold); color: var(--bg-dark); border: none;
            padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; width: 100%; transition: 0.2s;
        }
        button.action-btn:hover { background: var(--gold-hover); }
        input, select, textarea {
            width: 100%; padding: 9px; margin-top: 5px; margin-bottom: 10px;
            border-radius: 6px; border: 1px solid var(--border-color); background: #0c0a0f; color: #fff;
            box-sizing: border-box; font-family: Tahoma, sans-serif; font-size: 12px;
        }
        label { font-size: 11px; color: var(--text-muted); }
        .badge {
            display: inline-block; background: rgba(255,215,0,0.15); color: var(--gold);
            border: 1px solid var(--border-color); padding: 2px 8px; border-radius: 10px; font-size: 11px;
        }
        .alert-box {
            background: rgba(220, 38, 38, 0.1); border: 1px solid var(--danger-red);
            color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; line-height: 1.5;
        }
        .success-box {
            background: rgba(22, 163, 74, 0.1); border: 1px solid var(--success-green);
            color: #86efac; padding: 12px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- 1. الواجهة الخارجية المستقلة (Splash & Auth Screen) -->
    <div id="splashScreen">
        <div class="splash-card">
            <div class="splash-logo">💍</div>
            <div class="splash-title">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</div>
            <div class="splash-subtitle">المنصة الآمنة الأولى عربياً لإدارة العلاقات الجادة والخصوصية السيادية. مرحباً بك!</div>

            <button class="action-btn" style="margin-bottom: 10px;" onclick="openAuthModal('login')">تسجيل الدخول / إنشاء حساب جديد</button>
            <button class="action-btn" style="background: #1f1b26; color: var(--gold); border: 1px solid var(--border-color); margin-bottom: 10px;" onclick="enterGuestMode()">تصفح كزائر (تجربة 60 دقيقة يومياً)</button>
            <button class="action-btn" style="background: var(--primary-blue); color: #fff; margin-bottom: 10px;" onclick="startBiometricAuthModal()">🎤 التوثيق البايومتري (صوت + سيلفي +1500 كوينز)</button>
            <button class="action-btn" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); font-size: 11px;" onclick="openSupportModal()">📞 الاتصال بالإدارة والدعم الفني</button>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول الحقيقية -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="authTitle">تسجيل الدخول أو حساب جديد</h3>
            <label>الاسم الكامل أو المعرف (MAWDA-XXXX)</label>
            <input type="text" id="inputName" placeholder="أحمد العلي">
            <label>البريد الإلكتروني</label>
            <input type="email" id="inputEmail" placeholder="name@example.com">
            <label>كلمة المرور أو رمز الدخول</label>
            <input type="password" id="inputPass" placeholder="********">
            <button class="action-btn" style="margin-top: 10px;" onclick="executeLogin()">دخول وتفعيل الجلسة</button>
            <button class="action-btn" style="background: #333; color: #fff; margin-top: 8px;" onclick="closeModals()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة الاتصال بالإدارة والدعم (مع رفع لقطة الشاشة) -->
    <div id="supportModal" class="modal-overlay">
        <div class="modal-box">
            <h3>الدعم الفني والتبليغ السيادي</h3>
            <label>رسالتك أو الشكوى للأدمن:</label>
            <textarea id="supportMsg" rows="3" placeholder="اشرح مشكلتك أو استفسارك..."></textarea>
            <label>إرفاق لقطة شاشة (Screenshot):</label>
            <input type="file" id="supportFile">
            <button class="action-btn" style="margin-top: 10px;" onclick="submitSupportTicket()">إرسال للإدارة فوراً</button>
            <button class="action-btn" style="background: #333; color: #fff; margin-top: 8px;" onclick="closeModals()">إلغاء</button>
        </div>
    </div>

    <!-- 2. التطبيق الرئيسي -->
    <div id="mainApp">
        <div class="top-header">
            <h1 class="brand-title">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h1>
            <div class="header-controls">
                <span id="userCoinsBadge" class="badge">🪙 500 كوينز</span>
                <button class="nav-btn" style="padding: 4px 6px; font-size: 10px;" onclick="returnToSplash()">خروج</button>
                <select class="lang-selector" id="langSelect" onchange="changeLanguage()">
                    <option value="ar">AR</option>
                    <option value="en">EN</option>
                    <option value="fr">FR</option>
                </select>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('profile', event)">بروفايل العضو</button>
            <button class="nav-btn" onclick="switchTab('home', event)">الأقسام الرئيسية</button>
            <button class="nav-btn" onclick="switchTab('stores', event)">المتاجر والاقتصاد</button>
            <button class="nav-btn" onclick="switchTab('ads', event)">الإعلانات المبوبة</button>
            <button class="nav-btn" id="adminNavBtn" onclick="switchTab('admin', event)" style="display:none;">لوحة الأدمن السيادية</button>
        </div>

        <div id="dynamicView"></div>
    </div>

    <script>
        // الحالة العامة للتطبيق
        let appState = {
            name: "أحمد العلي",
            userId: "MAWDA-10254",
            bio: "تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة | دمشق، سوريا",
            verified: true,
            coins: 500,
            isAdmin: true, // مفعّل لتجربة السوبر أدمن فوراً
            adminPin: "7777",
            commission: 0.10,
            maintenanceMode: false,
            chatFrozen: false
        };

        if(localStorage.getItem('mawda_state_v2')) {
            appState = JSON.parse(localStorage.getItem('mawda_state_v2'));
        }

        function persistState() {
            localStorage.setItem('mawda_state_v2', JSON.stringify(appState));
        }

        function openAuthModal(type) {
            document.getElementById('authModal').style.display = 'flex';
        }

        function openSupportModal() {
            document.getElementById('supportModal').style.display = 'flex';
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }

        function executeLogin() {
            const name = document.getElementById('inputName').value;
            if(name) appState.name = name;
            persistState();
            closeModals();
            launchPlatform();
        }

        function enterGuestMode() {
            appState.name = "زائر كريم (تنزيل تجريبي 60 دقيقة)";
            appState.isAdmin = false;
            persistState();
            launchPlatform();
        }

        function startBiometricAuthModal() {
            if(confirm("هل تريد بدء التوثيق البايومتري المتقدم (صوت + فيديو سيلفي) للحصول على +1500 كوينز وشارة التوثيق الذهبية؟")) {
                setTimeout(() => {
                    appState.verified = true;
                    appState.coins += 1500;
                    persistState();
                    alert("تم بنجاح توثيق حسابك بايومترياً! حصلت على شارة التوثيق الذهبية ✔ ورصيد 1500 كوينز إضافي.");
                    launchPlatform();
                }, 800);
            }
        }

        function submitSupportTicket() {
            const msg = document.getElementById('supportMsg').value;
            if(!msg) { alert('الرجاء كتابة رسالة الدعم أولاً'); return; }
            alert("تم إرسال شكواك/بلاغك إلى إدارة السوبر أدمن بنجاح برقم تذكرة مرجعية #9102.");
            closeModals();
            document.getElementById('supportMsg').value = '';
        }

        function launchPlatform() {
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userCoinsBadge').innerText = `🪙 ${appState.coins} كوينز`;
            
            // إظهار زر لوحة الأدمن إذا كان السوبر أدمن مفعل
            if(appState.isAdmin) {
                document.getElementById('adminNavBtn').style.display = 'inline-block';
            }
            switchTab('profile');
        }

        function returnToSplash() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('splashScreen').style.display = 'flex';
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const root = document.getElementById('htmlRoot');
            root.setAttribute('lang', lang);
            root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        }

        // التبديل بين التبويبات
        function switchTab(tabName, event) {
            if(event && event.target) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }
            
            const view = document.getElementById('dynamicView');
            
            if (tabName === 'profile') {
                view.innerHTML = `
                    <div class="fb-profile-container">
                        <div class="fb-cover-photo">
                            <div id="adminBadgeBanner" class="admin-mode-banner" style="display:${appState.isAdmin ? 'block' : 'none'};">👑 وضع السوبر أدمن السيادي مفعل</div>
                        </div>
                        <div class="fb-header-section">
                            <div class="fb-avatar-container">
                                <div class="fb-avatar">👑</div>
                            </div>
                            <div class="fb-profile-info">
                                <h2 class="fb-profile-name">${appState.name} ${appState.verified ? '<span style="font-size:12px; color:var(--gold);">✔ موثق ذهبي</span>' : ''}</h2>
                                <p class="fb-profile-bio">${appState.bio}</p>
                            </div>
                            <div class="fb-actions-bar">
                                <button class="fb-btn" onclick="alert('تم إرسال طلب الصداقة بنجاح')">➕ إضافة صديق</button>
                                <button class="fb-btn secondary" onclick="openChatModal()">💬 مراسلة خاصة</button>
                                <button class="fb-btn secondary" onclick="toggleAdminIdentity()">🛡️ ${appState.isAdmin ? 'إلغاء وضع الأدمن' : 'تفعيل وضع السوبر أدمن'}</button>
                            </div>
                        </div>
                        <div class="fb-tabs">
                            <div class="fb-tab-item active">المنشورات</div>
                            <div class="fb-tab-item" onclick="editProfileSettings()">إعدادات الملف (الأمان وكلمة السر)</div>
                            <div class="fb-tab-item" onclick="alert('فتح الألبومات والصور')">الصور والألبومات</div>
                            <div class="fb-tab-item" onclick="alert('قائمة الأصدقاء')">الأصدقاء</div>
                        </div>
                    </div>

                    ${appState.maintenanceMode ? '<div class="alert-box">⚠️ تنبيه: وضع الصيانة العامة (Maintenance Mode) مفعل حالياً من قبل الإدارة.</div>' : ''}
                    ${appState.chatFrozen ? '<div class="alert-box">⚠️ تنبيه: تم تجميد الدردشة العامة (Chat Freeze) مؤقتاً من قبل السوبر أدمن.</div>' : ''}

                    <div class="card-panel">
                        <textarea id="postText" placeholder="ما الذي تفكر به يا أحمد؟ شارك لحظاتك أو إعلانك الشخصي..." rows="3"></textarea>
                        <button class="action-btn" onclick="addNewPost()">نشر المنشور على بروفايلك</button>
                    </div>

                    <div id="postsFeed">
                        <div class="card-panel">
                            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                                <div style="width:35px; height:35px; background:#333; border-radius:50%; display:flex; align-items:center; justify-content:center;">👑</div>
                                <div>
                                    <h4 style="margin:0; font-size:14px;">${appState.name}</h4>
                                    <span style="font-size:11px; color:var(--text-muted);">الآن • عام 🌍 (معرف: ${appState.userId})</span>
                                </div>
                            </div>
                            <p style="font-size:13px; margin-bottom:10px;">أهلاً بكم جميعاً في تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة. المنصة الآمنة الأولى بإدارة سيادية كاملة.</p>
                            <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-color); padding-top:8px; font-size:12px; color:var(--text-muted);">
                                <span style="cursor:pointer;" onclick="this.innerText='❤️ أعجبني (1)';">👍 أعجبني</span>
                                <span style="cursor:pointer;" onclick="prompt('اكتب تعليقك:')">💬 تعليق</span>
                                <span style="cursor:pointer;" onclick="alert('تم نسخ رابط المنشور')">↗️ مشاركة</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'home') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">أقسام تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h2>
                        <p>اختر القسم الذي يناسب تطلعاتك ضمن بيئة تفاعلية آمنة ومحمية بالكامل.</p>
                        <div class="grid-cards">
                            <div class="sub-card">
                                <h3>💍 العلاقات الجادة والزواج</h3>
                                <p>قسم مخصص للبحث عن شريك الحياة وفق معايير التوافق والجدية التامة.</p>
                                <button class="action-btn" onclick="alert('الدخول لقسم العلاقات الجادة والزواج بنجاح')">دخول القسم</button>
                            </div>
                            <div class="sub-card">
                                <h3>🌹 الواجهات الرومانسية</h3>
                                <p>أجواء دافئة وتجارب تواصل راقية تناسب اللحظات الخاصة والراقية.</p>
                                <button class="action-btn" onclick="alert('الدخول للواجهات الرومانسية بنجاح')">دخول القسم</button>
                            </div>
                            <div class="sub-card">
                                <h3>🔥 اللحظات الجريئة</h3>
                                <p>مساحة تفاعلية حرة ومميزة للمشتركين الباحثين عن إثارة استثنائية.</p>
                                <button class="action-btn" onclick="alert('الدخول لقسم اللحظات الجريئة بنجاح')">استكشاف</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'stores') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">متاجر مودة المتكاملة والاقتصاد الرقمي</h2>
                        <p>عزز حضورك في المنصة واكتسب صلاحيات استثنائية عبر أسواقنا الرقمية.</p>
                        <div class="grid-cards">
                            <div class="sub-card">
                                <h3>🪙 متجر الكوينز (محفظة مودة)</h3>
                                <p>شحن رصيد العملات الافتراضية لإرسال الهدايا والتفاعل المباشر (عمولة المنصة: ${appState.commission * 100}%).</p>
                                <button class="action-btn" onclick="buyCoins(1000)">شحن 1000 كوينز</button>
                            </div>
                            <div class="sub-card">
                                <h3>🛡️ متجر الأوسمة والميداليات</h3>
                                <p>احصل على أوسمة النخبة، الشارات الذهبية، وأوسمة الولاء المميزة.</p>
                                <button class="action-btn" onclick="alert('تم شراء وسام النخبة بنجاح!')">شراء وسام</button>
                            </div>
                            <div class="sub-card">
                                <h3>⚡ متجر الميزات الخاصة</h3>
                                <p>تفعيل وضع التخفي (Ghost Chat)، خلفيات الشات المخصصة، وتلوين اسمك الملكي.</p>
                                <button class="action-btn" onclick="alert('تم تفعيل وضع التخفي والميزات الخاصة بنجاح!')">تفعيل ميزة</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'ads') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">قسم الإعلانات المبوبة السيادية</h2>
                        <p>الإعلانات والعروض الخاصة المنشورة رسمياً بواسطة مالك التطبيق (الأدمن حصرياً).</p>
                        <div style="background: rgba(255,215,0,0.05); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px;">
                            <h4 style="color: var(--gold); margin: 0 0 5px 0;">إعلان مميز رقم #1 (إدارة المنصة)</h4>
                            <p style="margin: 0; font-size: 12px;">عرض خاص لفترة محدودة: تفعيل عضويات النخبة والترقية الفورية لشهر كامل مع هدية 5000 كوينز لجميع الأعضاء الموثقين.</p>
                        </div>
                    </div>
                `;
            } else if (tabName === 'admin') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">لوحة التحكم السيادية (السوبر أدمن - صلاحيات مطلقة)</h2>
                        <p style="font-size: 11px; color: var(--text-muted);">منطقة محمية بالكامل لإدارة العمولات، الإعلانات، أزرار الطوارئ، والحظر السيادي.</p>
                        
                        <div style="margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                            <h4 style="color: var(--gold); font-size: 13px; margin: 0 0 10px 0;">🚨 أزرار الطوارئ والسيطرة العامة (Sovereign Emergency Controls)</h4>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <button class="action-btn" style="flex:1; background:${appState.maintenanceMode ? '#16a34a' : '#ca8a04'}; color:#fff;" onclick="toggleMaintenance()">
                                    ${appState.maintenanceMode ? 'إيقاف وضع الصيانة' : '🛡️ زر وضع الصيانة (Maintenance Mode)'}
                                </button>
                                <button class="action-btn" style="flex:1; background:${appState.chatFrozen ? '#16a34a' : '#dc2626'}; color:#fff;" onclick="toggleChatFreeze()">
                                    ${appState.chatFrozen ? 'إلغاء تجميد الشات' : '⚡ تجميد الدردشة العامة (Chat Freeze)'}
                                </button>
                            </div>
                            <button class="action-btn" style="background: var(--primary-blue); color: #fff; margin-top: 10px;" onclick="sendBroadcastPush()">
                                📢 إرسال إشعار طارئ عام (Global Broadcast / Pop-up) لجميع الأعضاء
                            </button>
                        </div>

                        <div style="margin-bottom: 12px;">
                            <label>تعديل نسبة عمولة التحويل للمنصة (الحالية: ${appState.commission * 100}%):</label>
                            <input type="number" id="commInput" value="${appState.commission}" step="0.01">
                            <button class="action-btn" onclick="saveCommission()">حفظ نسبة العمولة الجديدة</button>
                        </div>

                        <div style="margin-bottom: 12px;">
                            <label>استوديو الإعلانات المبوبة والتجارية (نشر فوري):</label>
                            <textarea id="adminAdBox" placeholder="اكتب نص الإعلان التجاري أو الرسومي هنا..."></textarea>
                            <button class="action-btn" onclick="publishAdminAd()">نشر إعلان فوري في عموم المنصة</button>
                        </div>

                        <div style="margin-bottom: 12px;">
                            <label>الحظر السيادي الشامل (حظر نهائي عبر الـ IP وبصمة الجهاز Hardware Ban):</label>
                            <input type="text" id="banTarget" placeholder="أدخل معرف المستخدم أو الـ IP أو بصمة الجهاز...">
                            <button class="action-btn" style="background: var(--danger-red); color: #fff;" onclick="executeSovereignBan()">تنفيذ الحظر السيادي الفوري للأجهزة</button>
                        </div>
                    </div>
                `;
            }
        }

        function toggleAdminIdentity() {
            appState.isAdmin = !appState.isAdmin;
            persistState();
            document.getElementById('adminNavBtn').style.display = appState.isAdmin ? 'inline-block' : 'none';
            switchTab('profile');
            alert(appState.isAdmin ? "تم تفعيل وضع السوبر أدمن السيادي بنجاح!" : "تم العودة للبروفايل الشخصي العادي.");
        }

        function editProfileSettings() {
            const newBio = prompt("تعديل النبذة الشخصية (Bio) ومعلومات الملف:", appState.bio);
            if(newBio) {
                appState.bio = newBio;
                persistState();
                switchTab('profile');
                alert("تم تحديث معلومات البروفايل بنجاح!");
            }
        }

        function buyCoins(amount) {
            appState.coins += amount;
            persistState();
            document.getElementById('userCoinsBadge').innerText = `🪙 ${appState.coins} كوينز`;
            alert(`تم شحن ${amount} كوينز بنجاح مع تطبيق عمولة المنصة (${appState.commission * 100}%)!`);
        }

        function openChatModal() {
            const msg = prompt("اكتب رسالتك الفورية (تدمر تلقائياً بعد ساعتين):");
            if(msg) alert("تم إرسال الرسالة بنجاح مع تفعيل نظام الحماية والتدمير التلقائي!");
        }

        function toggleMaintenance() {
            appState.maintenanceMode = !appState.maintenanceMode;
            persistState();
            switchTab('admin');
            alert(appState.maintenanceMode ? "تم تفعيل وضع الصيانة العامة بنجاح." : "تم إيقاف وضع الصيانة وعودة المنصة للخدمة.");
        }

        function toggleChatFreeze() {
            appState.chatFrozen = !appState.chatFrozen;
            persistState();
            switchTab('admin');
            alert(appState.chatFrozen ? "تم تجميد جميع الدردشات العامة والخاصة طوارئ." : "تم إلغاء التجميد وعودة الدردشة للعمل.");
        }

        function sendBroadcastPush() {
            const text = prompt("أدخل نص الإشعار الطارئ أو التنبيه الذي سيظهر لجميع الأعضاء:");
            if(text) alert("تم بث الإشعار الفوري (Global Broadcast) بنجاح لجميع المتواجدين على المنصة!");
        }

        function saveCommission() {
            const val = parseFloat(document.getElementById('commInput').value);
            if(!isNaN(val)) {
                appState.commission = val;
                persistState();
                alert(`تم تحديث عمولة المنصة بنجاح لتصبح ${val * 100}%`);
            }
        }

        function publishAdminAd() {
            const ad = document.getElementById('adminAdBox').value;
            if(ad) {
                alert("تم نشر الإعلان التجاري السيادي بنجاح في قسم الإعلانات المبوبة!");
                document.getElementById('adminAdBox').value = '';
            }
        }

        function executeSovereignBan() {
            const target = document.getElementById('banTarget').value;
            if(target) {
                alert(`تم تنفيذ الحظر السيادي النهائي (Hardware/IP Ban) على الهدف: ${target} بنجاح ولن يتمكن من الدخول نهائياً.`);
                document.getElementById('banTarget').value = '';
            }
        }

        function addNewPost() {
            const txt = document.getElementById('postText').value;
            if(!txt.trim()) { alert('الرجاء كتابة نص المنشور أولاً!'); return; }
            const feed = document.getElementById('postsFeed');
            const card = document.createElement('div');
            card.className = 'card-panel';
            card.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <div style="width:35px; height:35px; background:#333; border-radius:50%; display:flex; align-items:center; justify-content:center;">👑</div>
                    <div>
                        <h4 style="margin:0; font-size:14px;">${appState.name}</h4>
                        <span style="font-size:11px; color:var(--text-muted);">الآن • عام 🌍</span>
                    </div>
                </div>
                <p style="font-size:13px; margin-bottom:10px;">${txt}</p>
                <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-color); padding-top:8px; font-size:12px; color:var(--text-muted);">
                    <span style="cursor:pointer;" onclick="this.innerText='❤️ أعجبني (1)';">👍 أعجبني</span>
                    <span style="cursor:pointer;" onclick="prompt('اكتب تعليقك:')">💬 تعليق</span>
                    <span style="cursor:pointer;" onclick="alert('تم نسخ رابط المنشور')">↗️ مشاركة</span>
                </div>
            `;
            feed.prepend(card);
            document.getElementById('postText').value = '';
            alert('تم نشر المنشور على بروفايلك بنجاح!');
        }
    </script>
</body>
</html>
