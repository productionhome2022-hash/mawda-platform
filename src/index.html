<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة مودة السينمائية 👑</title>
  <!-- استيراد خط تجوال الفاخر -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- ربط ملف التصميم السينمائي العام -->
  <link rel="stylesheet" href="./styles/global.css">
</head>
<body style="background-color: #0b090e; color: #f3f0f7; font-family: 'Tajawal', sans-serif; margin: 0; min-height: 100vh;">

  <!-- الحاوية الرئيسية التي تتغير بداخله الصفحات (Home, Profile, Admin) -->
  <div id="app"></div>

  <!-- نقطة الدخول البرمجية للمنصة -->
  <script type="module">
    import { renderHomeView } from "./views/HomeView.js";
    import { renderAdminView } from "./views/AdminView.js";

    const appContainer = document.getElementById('app');

    // التشغيل التلقائي للعرض على الصفحة الرئيسية مع تفعيل بوابة السوبر أدمن
    renderHomeView(appContainer, () => {
      // عند تفعيل البوابة السرية (5 نقرات على الشعار)، تنتقل فوراً لوحة التحكم السيادية
      renderAdminView(appContainer);
    });
  </script>

</body>
</html>
