<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
    <style>
        :root {
            --bg-dark: #0a090d;
            --panel-bg: #151319;
            --gold: #ffd700;
            --gold-hover: #e6c200;
            --text-main: #f3f4f6;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 215, 0, 0.25);
            --primary-blue: #2563eb;
            --success-green: #16a34a;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        /* 1. الواجهة الخارجية المستقلة (Landing & Auth Screen) */
        #splashScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at center, #1e1929 0%, #0a090d 100%);
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            box-sizing: border-box;
        }
        .splash-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .splash-logo {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .splash-title {
            color: var(--gold);
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .splash-subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* 2. التطبيق الرئيسي (Main Platform) */
        #mainApp {
            display: none;
            max-width: 950px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .top-header {
            background: rgba(10, 9, 13, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-title {
            color: var(--gold);
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }
        .lang-selector {
            background: #231f2b;
            color: var(--gold);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            background: var(--panel-bg);
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .nav-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }

        /* 3. تصميم بروفايل فيسبوك الاحترافي */
        .fb-profile-container {
            background: var(--panel-bg);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-top: none;
        }
        .fb-cover-photo {
            height: 220px;
            background: linear-gradient(135deg, #2b1f3d, #120e17);
        }
        .fb-header-section {
            padding: 0 20px 20px 20px;
            position: relative;
        }
        .fb-avatar-container {
            position: relative;
            display: inline-block;
            margin-top: -75px;
            margin-left: 20px;
        }
        .fb-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--panel-bg);
            object-fit: cover;
            background: #2b2735;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: var(--gold);
        }
        .fb-profile-info {
            display: inline-block;
            vertical-align: top;
            margin-top: 10px;
        }
        .fb-profile-name {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
        }
        .fb-profile-bio {
            font-size: 13px;
            color: var(--text-muted);
            margin: 5px 0 10px 0;
        }
        .fb-actions-bar {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .fb-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .fb-btn.secondary {
            background: #231f2b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .fb-tabs {
            display: flex;
            gap: 20px;
            padding: 0 20px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 13px;
        }
        .fb-tab-item {
            padding: 14px 0;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        .fb-tab-item.active {
            color: var(--gold);
            border-bottom: 3px solid var(--gold);
        }

        /* 4. اللوحات والنماذج العامة */
        .card-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .sub-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            text-align: center;
        }
        .sub-card h3 {
            color: var(--gold);
            font-size: 16px;
            margin-bottom: 8px;
        }
        .sub-card p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 15px;
        }
        button.action-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            transition: 0.2s;
        }
        button.action-btn:hover {
            background: var(--gold-hover);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #100e14;
            color: #fff;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
            font-size: 13px;
        }
        label {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- الواجهة الخارجية المستقلة للزوار والأعضاء (Splash / Auth Screen) -->
    <div id="splashScreen">
        <div class="splash-card">
            <div class="splash-logo">💍</div>
            <div class="splash-title">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</div>
            <div class="splash-subtitle">المنصة الآمنة الأولى عربياً لإدارة العلاقات الجادة والخصوصية السيادية. مرحباً بك!</div>

            <!-- خيارات الدخول والتوثيق الحقيقية للزوار -->
            <button class="action-btn" style="margin-bottom: 10px;" onclick="showLoginModal()">تسجيل الدخول / إنشاء حساب جديد</button>
            <button class="action-btn" style="background: #231f2b; color: var(--gold); border: 1px solid var(--border-color); margin-bottom: 10px;" onclick="enterApp('guest')">تصفح كزائر (تجربة 60 دقيقة يومياً)</button>
            <button class="action-btn" style="background: var(--primary-blue); color: #fff;" onclick="enterApp('auth')">🎤 التوثيق البايومتري (صوت + سيلفي)</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي (يظهر بعد دخول العضو أو الزائر) -->
    <div id="mainApp">
        <div class="top-header">
            <h1 class="brand-title">💍 تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="nav-btn" style="padding: 4px 8px; font-size: 10px;" onclick="returnToSplash()">الخروج / الرئيسية</button>
                <select class="lang-selector" id="langSelect" onchange="changeLanguage()">
                    <option value="ar">AR</option>
                    <option value="en">EN</option>
                    <option value="fr">FR</option>
                </select>
            </div>
        </div>

        <!-- شريط التنقل العلوي للأقسام والمتاجر -->
        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('profile', event)">بروفايل العضو</button>
            <button class="nav-btn" onclick="switchTab('home', event)">الأقسام الأساسية</button>
            <button class="nav-btn" onclick="switchTab('stores', event)">المتاجر والاقتصاد</button>
            <button class="nav-btn" onclick="switchTab('ads', event)">الإعلانات المبوبة</button>
            <button class="nav-btn" onclick="switchTab('admin', event)">لوحة الأدمن السيادية</button>
        </div>

        <!-- الحاوية الديناميكية لتبديل المحتوى -->
        <div id="dynamicView"></div>
    </div>

    <script>
        let userMode = 'guest';

        function showLoginModal() {
            const email = prompt("أدخل البريد الإلكتروني أو اسم المستخدم لتسجيل الدخول:");
            if(email) {
                alert("مرحباً بك في تطبيق مودة! تم تسجيل دخولك بنجاح.");
                enterApp('member');
            }
        }

        function enterApp(mode) {
            userMode = mode;
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';

            if(mode === 'guest') {
                alert('تم تفعيل وضع الزائر بنجاح (متاح لمدة 60 دقيقة يومياً). يمكنك تصفح الأقسام والبروفايلات.');
                switchTab('home');
            } else if(mode === 'auth') {
                alert('فتح نظام التوثيق البايومتري المتقدم (بصمة الصوت + الفيديو السيلفي المتحرك). مكافأة التوثيق: +1500 كوينز وشارة التوثيق الذهبية!');
                switchTab('profile');
            } else {
                switchTab('profile');
            }
        }

        function returnToSplash() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('splashScreen').style.display = 'flex';
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const root = document.getElementById('htmlRoot');
            if(lang === 'ar') {
                root.setAttribute('lang', 'ar');
                root.setAttribute('dir', 'rtl');
            } else {
                root.setAttribute('lang', lang);
                root.setAttribute('dir', 'ltr');
            }
        }

        function switchTab(tabName, event) {
            if(event && event.target) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }
            
            const view = document.getElementById('dynamicView');
            
            if (tabName === 'profile') {
                view.innerHTML = `
                    <div class="fb-profile-container">
                        <div class="fb-cover-photo"></div>
                        <div class="fb-header-section">
                            <div class="fb-avatar-container">
                                <div class="fb-avatar">👑</div>
                            </div>
                            <div class="fb-profile-info">
                                <h2 class="fb-profile-name">أحمد العلي <span style="font-size:13px; color:var(--gold);">✔ موثق ذهبي</span></h2>
                                <p class="fb-profile-bio">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة | دمشق، سوريا</p>
                            </div>
                            <div class="fb-actions-bar">
                                <button class="fb-btn" onclick="alert('تم إرسال طلب الصداقة بنجاح')">➕ إضافة صديق</button>
                                <button class="fb-btn secondary" onclick="alert('فتح نافذة الدردشة الفورية الخاصة وتدمير الوسائط تلقائياً بعد ساعتين')">💬 إرسال رسالة</button>
                                <button class="fb-btn secondary" onclick="alert('تمت المتابعة بنجاح')">🔔 متابعة</button>
                            </div>
                        </div>
                        <div class="fb-tabs">
                            <div class="fb-tab-item active" onclick="alert('عرض جدار المنشورات')">المنشورات</div>
                            <div class="fb-tab-item" onclick="alert('عرض معلومات الملف الشخصي والتوافق')">حول الملف</div>
                            <div class="fb-tab-item" onclick="alert('عرض الصور والألبومات الخاصة')">الصور والألبومات</div>
                            <div class="fb-tab-item" onclick="alert('عرض قائمة الأصدقاء والمتابعين')">الأصدقاء</div>
                        </div>
                    </div>
                    <div class="card-panel">
                        <textarea id="postText" placeholder="ما الذي تفكر به يا أحمد؟ شارك لحظاتك أو إعلانك الشخصي..." rows="3"></textarea>
                        <button class="action-btn" onclick="addNewPost()">نشر المنشور الآن</button>
                    </div>
                    <div id="postsFeed">
                        <div class="card-panel">
                            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                                <div style="width:35px; height:35px; background:#333; border-radius:50%; display:flex; align-items:center; justify-content:center;">👑</div>
                                <div>
                                    <h4 style="margin:0; font-size:14px;">أحمد العلي</h4>
                                    <span style="font-size:11px; color:var(--text-muted);">منذ ساعتين • عام 🌍</span>
                                </div>
                            </div>
                            <p style="font-size:13px; margin-bottom:10px;">أهلاً بكم جميعاً في منصة مودة للتعارف والدردشة والزواج والعلاقات الجادة. تجربة التواصل الأولى المحمية بأعلى معايير الخصوصية السيادية.</p>
                            <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-color); padding-top:8px; font-size:12px; color:var(--text-muted);">
                                <span style="cursor:pointer;" onclick="alert('👍 تم الإعجاب بالمنشور')">👍 أعجبني</span>
                                <span style="cursor:pointer;" onclick="alert('💬 فتح التعليقات')">💬 تعليق</span>
                                <span style="cursor:pointer;" onclick="alert('↗️ مشاركة المنشور')">↗️ مشاركة</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'home') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 18px; margin-top:0;">أقسام المنصة الأساسية وغرف الدردشة</h2>
                        <p>اختر القسم الذي يناسب تطلعاتك ضمن بيئة تفاعلية آمنة ومحمية بالكامل.</p>
                        <div class="grid-cards">
                            <div class="sub-card">
                                <h3>💍 العلاقات الجادة والزواج</h3>
                                <p>قسم مخصص للبحث عن شريك الحياة وفق معايير التوافق والجدية التامة.</p>
                                <button class="action-btn" onclick="alert('جاري فتح قسم العلاقات الجادة والزواج...')">دخول القسم</button>
                            </div>
                            <div class="sub-card">
                                <h3>🌹 الواجهات الرومانسية</h3>
                                <p>أجواء دافئة وتجارب تواصل راقية تناسب اللحظات الخاصة والراقية.</p>
                                <button class="action-btn" onclick="alert('جاري فتح الواجهات الرومانسية...')">دخول القسم</button>
                            </div>
                            <div class="sub-card">
                                <h3>🔥 اللحظات الجريئة</h3>
                                <p>مساحة تفاعلية حرة ومميزة للمشتركين الباحثين عن إثارة استثنائية.</p>
                                <button class="action-btn" onclick="alert('جاري فتح قسم اللحظات الجريئة...')">استكشاف</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'stores') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 18px; margin-top:0;">متاجر مودة المتكاملة والاقتصاد الرقمي</h2>
                        <p>عزز حضورك في المنصة واكتسب صلاحيات استثنائية عبر أسواقنا الرقمية.</p>
                        <div class="grid-cards">
                            <div class="sub-card">
                                <h3>🪙 متجر الكوينز</h3>
                                <p>شحن رصيد العملات الافتراضية لإرسال الهدايا والتفاعل المباشر.</p>
                                <button class="action-btn" onclick="alert('فتح باقات شحن الكوينز وإدارة المحفظة الرقمية...')">شحن كوينز</button>
                            </div>
                            <div class="sub-card">
                                <h3>🛡️ متجر الأوسمة والميداليات</h3>
                                <p>احصل على أوسمة النخبة، الشارات الذهبية، وأوسمة الولاء المميزة.</p>
                                <button class="action-btn" onclick="alert('فتح متجر أوسمة التميز والنخبة...')">شراء وسام</button>
                            </div>
                            <div class="sub-card">
                                <h3>⚡ متجر الميزات الخاصة</h3>
                                <p>تفعيل وضع التخفي (Ghost Chat)، خلفيات الشات المخصصة، وإزالة الإعلانات.</p>
                                <button class="action-btn" onclick="alert('تفعيل الميزات الخاصة ووضع التخفي...')">تفعيل ميزة</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'ads') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 18px; margin-top:0;">قسم الإعلانات المبوبة السيادية</h2>
                        <p>الإعلانات والعروض الخاصة المنشورة رسمياً بواسطة مالك التطبيق (الأدمن حصرياً).</p>
                        <div style="background: rgba(255,215,0,0.05); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px;">
                            <h4 style="color: var(--gold); margin: 0 0 5px 0;">إعلان مميز رقم #1 (إدارة المنصة)</h4>
                            <p style="margin: 0; font-size: 13px;">عرض خاص لفترة محدودة: تفعيل عضويات النخبة والترقية الفورية لشهر كامل مع هدية 5000 كوينز لجميع الأعضاء الموثقين.</p>
                        </div>
                    </div>
                `;
            } else if (tabName === 'admin') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 18px; margin-top:0;">لوحة التحكم السيادية (السوبر أدمن)</h2>
                        <p style="font-size:
