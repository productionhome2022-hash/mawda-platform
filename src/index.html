<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
    <style>
        :root {
            --bg-dark: #0a090d;
            --panel-bg: #151319;
            --gold: #ffd700;
            --gold-hover: #e6c200;
            --text-main: #f3f4f6;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 215, 0, 0.25);
            --primary-blue: #2563eb;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        /* الواجهة الخارجية (Splash & Auth) */
        #splashScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at center, #1e1929 0%, #0a090d 100%);
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            box-sizing: border-box;
        }
        .splash-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .splash-logo {
            font-size: 55px;
            margin-bottom: 10px;
        }
        .splash-title {
            color: var(--gold);
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .splash-subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        /* التطبيق الرئيسي */
        #mainApp {
            display: none;
            max-width: 950px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .top-header {
            background: rgba(10, 9, 13, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-title {
            color: var(--gold);
            font-size: 13px;
            font-weight: bold;
            margin: 0;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lang-selector {
            background: #231f2b;
            color: var(--gold);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            background: var(--panel-bg);
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .nav-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--border-color);
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }
        /* بروفايل فيسبوك */
        .fb-profile-container {
            background: var(--panel-bg);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-top: none;
        }
        .fb-cover-photo {
            height: 200px;
            background: linear-gradient(135deg, #2b1f3d, #120e17);
        }
        .fb-header-section {
            padding: 0 20px 20px 20px;
            position: relative;
        }
        .fb-avatar-container {
            position: relative;
            display: inline-block;
            margin-top: -70px;
            margin-left: 20px;
        }
        .fb-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--panel-bg);
            object-fit: cover;
            background: #2b2735;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--gold);
        }
        .fb-profile-info {
            display: inline-block;
            vertical-align: top;
            margin-top: 10px;
        }
        .fb-profile-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
        }
        .fb-profile-bio {
            font-size: 12px;
            color: var(--text-muted);
            margin: 5px 0 10px 0;
        }
        .fb-actions-bar {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .fb-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .fb-btn.secondary {
            background: #231f2b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .fb-tabs {
            display: flex;
            gap: 15px;
            padding: 0 20px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 12px;
        }
        .fb-tab-item {
            padding: 12px 0;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        .fb-tab-item.active {
            color: var(--gold);
            border-bottom: 3px solid var(--gold);
        }
        /* البطاقات والنماذج */
        .card-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            margin: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .sub-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .sub-card h3 {
            color: var(--gold);
            font-size: 15px;
            margin-bottom: 8px;
        }
        .sub-card p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 12px;
        }
        button.action-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            transition: 0.2s;
        }
        button.action-btn:hover {
            background: var(--gold-hover);
        }
        input, select, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #100e14;
            color: #fff;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
            font-size: 12px;
        }
        label {
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- الواجهة الخارجية الحقيقية والدقيقة -->
    <div id="splashScreen">
        <div class="splash-card">
            <div class="splash-logo">💍</div>
            <div class="splash-title">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</div>
            <div class="splash-subtitle">المنصة الآمنة الأولى عربياً لإدارة العلاقات الجادة والخصوصية السيادية. مرحباً بك!</div>

            <button class="action-btn" style="margin-bottom: 10px;" onclick="enterPlatform('member')">تسجيل الدخول / إنشاء حساب جديد</button>
            <button class="action-btn" style="background: #231f2b; color: var(--gold); border: 1px solid var(--border-color); margin-bottom: 10px;" onclick="enterPlatform('guest')">تصفح كزائر (تجربة 60 دقيقة يومياً)</button>
            <button class="action-btn" style="background: var(--primary-blue); color: #fff;" onclick="enterPlatform('auth')">🎤 التوثيق البايومتري (صوت + سيلفي)</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="mainApp">
        <div class="top-header">
            <h1 class="brand-title">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h1>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="nav-btn" style="padding: 4px 8px; font-size: 10px;" onclick="returnToSplash()">الرئيسية</button>
                <select class="lang-selector" id="langSelect" onchange="changeLanguage()">
                    <option value="ar">AR</option>
                    <option value="en">EN</option>
                    <option value="fr">FR</option>
                </select>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('profile', event)">بروفايل العضو</button>
            <button class="nav-btn" onclick="switchTab('home', event)">الأقسام الأساسية</button>
            <button class="nav-btn" onclick="switchTab('stores', event)">المتاجر والاقتصاد</button>
            <button class="nav-btn" onclick="switchTab('ads', event)">الإعلانات المبوبة</button>
            <button class="nav-btn" onclick="switchTab('admin', event)">لوحة الأدمن السيادية</button>
        </div>

        <div id="dynamicView"></div>
    </div>

    <script>
        function enterPlatform(mode) {
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';

            if(mode === 'guest') {
                alert('تم تفعيل وضع الزائر بنجاح (متاح لمدة 60 دقيقة يومياً).');
                switchTab('home');
            } else if(mode === 'auth') {
                alert('فتح نظام التوثيق البايومتري المتقدم (بصمة الصوت + الفيديو السيلفي). مكافأة التوثيق: +1500 كوينز!');
                switchTab('profile');
            } else {
                switchTab('profile');
            }
        }

        function returnToSplash() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('splashScreen').style.display = 'flex';
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const root = document.getElementById('htmlRoot');
            root.setAttribute('lang', lang);
            root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        }

        function switchTab(tabName, event) {
            if(event && event.target) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }
            
            const view = document.getElementById('dynamicView');
            
            if (tabName === 'profile') {
                view.innerHTML = `
                    <div class="fb-profile-container">
                        <div class="fb-cover-photo"></div>
                        <div class="fb-header-section">
                            <div class="fb-avatar-container">
                                <div class="fb-avatar">👑</div>
                            </div>
                            <div class="fb-profile-info">
                                <h2 class="fb-profile-name">أحمد العلي <span style="font-size:12px; color:var(--gold);">✔ موثق ذهبي</span></h2>
                                <p class="fb-profile-bio">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة | دمشق، سوريا</p>
                            </div>
                            <div class="fb-actions-bar">
                                <button class="fb-btn" onclick="alert('تم إرسال طلب الصداقة بنجاح')">➕ إضافة صديق</button>
                                <button class="fb-btn secondary" onclick="alert('فتح نافذة الدردشة الفورية الخاصة وتدمير الوسائط تلقائياً')">💬 إرسال رسالة</button>
                                <button class="fb-btn secondary" onclick="alert('تمت المتابعة بنجاح')">🔔 متابعة</button>
                            </div>
                        </div>
                        <div class="fb-tabs">
                            <div class="fb-tab-item active" onclick="alert('جدار المنشورات')">المنشورات</div>
                            <div class="fb-tab-item" onclick="alert('معلومات الملف الشخصي')">حول الملف</div>
                            <div class="fb-tab-item" onclick="alert('الصور والألبومات الخاصة')">الصور والألبومات</div>
                            <div class="fb-tab-item" onclick="alert('قائمة الأصدقاء والمتابعين')">الأصدقاء</div>
                        </div>
                    </div>
                    <div class="card-panel">
                        <textarea id="postText" placeholder="ما الذي تفكر به يا أحمد؟ شارك لحظاتك أو إعلانك الشخصي..." rows="3"></textarea>
                        <button class="action-btn" onclick="addNewPost()">نشر المنشور الآن</button>
                    </div>
                    <div id="postsFeed">
                        <div class="card-panel">
                            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                                <div style="width:35px; height:35px; background:#333; border-radius:50%; display:flex; align-items:center; justify-content:center;">👑</div>
                                <div>
                                    <h4 style="margin:0; font-size:14px;">أحمد العلي</h4>
                                    <span style="font-size:11px; color:var(--text-muted);">منذ ساعتين • عام 🌍</span>
                                </div>
                            </div>
                            <p style="font-size:13px; margin-bottom:10px;">أهلاً بكم في منصة مودة للتعارف والدردشة والزواج والعلاقات الجادة. تجربة التواصل المحمية بأعلى معايير الخصوصية السيادية.</p>
                            <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-color); padding-top:8px; font-size:12px; color:var(--text-muted);">
                                <span style="cursor:pointer;" onclick="alert('👍 تم الإعجاب بالمنشور')">👍 أعجبني</span>
                                <span style="cursor:pointer;" onclick="alert('💬 فتح التعليقات')">💬 تعليق</span>
                                <span style="cursor:pointer;" onclick="alert('↗️ مشاركة المنشور')">↗️ مشاركة</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'home') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">أقسام المنصة الأساسية وغرف الدردشة</h2>
                        <p>اختر القسم الذي يناسب تطلعاتك ضمن بيئة تفاعلية آمنة ومحمية بالكامل.</p>
                        <div class="grid-cards">
                            <div class="sub-card">
                                <h3>💍 العلاقات الجادة والزواج</h3>
                                <p>قسم مخصص للبحث عن شريك الحياة وفق معايير التوافق والجدية التامة.</p>
                                <button class="action-btn" onclick="alert('جاري فتح قسم العلاقات الجادة والزواج...')">دخول القسم</button>
                            </div>
                            <div class="sub-card">
                                <h3>🌹 الواجهات الرومانسية</h3>
                                <p>أجواء دافئة وتجارب تواصل راقية تناسب اللحظات الخاصة والراقية.</p>
                                <button class="action-btn" onclick="alert('جاري فتح الواجهات الرومانسية...')">دخول القسم</button>
                            </div>
                            <div class="sub-card">
                                <h3>🔥 اللحظات الجريئة</h3>
                                <p>مساحة تفاعلية حرة ومميزة للمشتركين الباحثين عن إثارة استثنائية.</p>
                                <button class="action-btn" onclick="alert('جاري فتح قسم اللحظات الجريئة...')">استكشاف</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'stores') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">متاجر مودة المتكاملة والاقتصاد الرقمي</h2>
                        <p>عزز حضورك في المنصة واكتسب صلاحيات استثنائية عبر أسواقنا الرقمية.</p>
                        <div class="grid-cards">
                            <div class="sub-card">
                                <h3>🪙 متجر الكوينز</h3>
                                <p>شحن رصيد العملات الافتراضية لإرسال الهدايا والتفاعل المباشر.</p>
                                <button class="action-btn" onclick="alert('فتح باقات شحن الكوينز وإدارة المحفظة الرقمية...')">شحن كوينز</button>
                            </div>
                            <div class="sub-card">
                                <h3>🛡️ متجر الأوسمة والميداليات</h3>
                                <p>احصل على أوسمة النخبة، الشارات الذهبية، وأوسمة الولاء المميزة.</p>
                                <button class="action-btn" onclick="alert('فتح متجر أوسمة التميز والنخبة...')">شراء وسام</button>
                            </div>
                            <div class="sub-card">
                                <h3>⚡ متجر الميزات الخاصة</h3>
                                <p>تفعيل وضع التخفي (Ghost Chat)، خلفيات الشات المخصصة، وإزالة الإعلانات.</p>
                                <button class="action-btn" onclick="alert('تفعيل الميزات الخاصة ووضع التخفي...')">تفعيل ميزة</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'ads') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">قسم الإعلانات المبوبة السيادية</h2>
                        <p>الإعلانات والعروض الخاصة المنشورة رسمياً بواسطة مالك التطبيق (الأدمن حصرياً).</p>
                        <div style="background: rgba(255,215,0,0.05); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px;">
                            <h4 style="color: var(--gold); margin: 0 0 5px 0;">إعلان مميز رقم #1 (إدارة المنصة)</h4>
                            <p style="margin: 0; font-size: 12px;">عرض خاص لفترة محدودة: تفعيل عضويات النخبة والترقية الفورية لشهر كامل مع هدية 5000 كوينز لجميع الأعضاء الموثقين.</p>
                        </div>
                    </div>
                `;
            } else if (tabName === 'admin') {
                view.innerHTML = `
                    <div class="card-panel">
                        <h2 style="color: var(--gold); font-size: 17px; margin-top:0;">لوحة التحكم السيادية (السوبر أدمن)</h2>
                        <p style="font-size: 11px; color: var(--text-muted);">منطقة محمية بالكامل لإدارة العمولات، الغرف، الإعلانات، والحظر السيادي للأجهزة.</p>
                        <div style="margin-bottom: 12px;">
                            <label>نسبة عمولة التحويل للمنصة:</label>
                            <input type="number" id="commissionInput" value="0.10" step="0.01">
                            <button class="action-btn" onclick="alert('تم حفظ نسبة العمولة بنجاح')">حفظ نسبة العمولة</button>
                        </div>
                        <div style="margin-bottom: 12px;">
                            <label>نشر إعلان مبوب جديد (خاص بالأدمن حصرياً):</label>
                            <textarea id="adminAdText" placeholder="اكتب نص الإعلان الرسمي هنا..."></textarea>
                            <button class="action-btn" onclick="alert('تم نشر الإعلان بنجاح في عموم المنصة')">نشر الإعلان الآن</button>
                        </div>
                        <div style="margin-bottom: 12px;">
                            <label>الحظر السيادي الشامل (حظر IP أو بصمة الجهاز):</label>
                            <input type="text" placeholder="أدخل معرف المستخدم أو الـ IP للحظر...">
                            <button class="action-btn" style="background: #dc2626; color: #fff;" onclick="alert('تم تنفيذ الحظر السيادي الفوري على الجهاز بنجاح')">تنفيذ الحظر الفوري</button>
                        </div>
                    </div>
                `;
            }
        }

        function addNewPost() {
            const txt = document.getElementById('postText').value;
            if(!txt.trim()) {
                alert('الرجاء كتابة نص المنشور أولاً!');
                return;
            }
            const feed = document.getElementById('postsFeed');
            const newCard = document.createElement('div');
            newCard.className = 'card-panel';
            newCard.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <div style="width:35px; height:35px; background:#333; border-radius:50%; display:flex; align-items:center; justify-content:center;">👑</div>
                    <div>
                        <h4 style="margin:0; font-size:14px;">أحمد العلي</h4>
                        <span style="font-size:11px; color:var(--text-muted);">الآن • عام 🌍</span>
                    </div>
                </div>
                <p style="font-size:13px; margin-bottom:10px;">${txt}</p>
                <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-color); padding-top:8px; font-size:12px; color:var(--text-muted);">
                    <span style="cursor:pointer;" onclick="alert('👍 تم الإعجاب بالمنشور')">👍 أعجبني</span>
                    <span style="cursor:pointer;" onclick="alert('💬 فتح التعليقات')">💬 تعليق</span>
