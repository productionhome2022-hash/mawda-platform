<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
    <style>
        :root {
            --gold: #ffd700;
            --gold-hover: #e6c200;
            --text-main: #ffffff;
            --text-muted: #e5e7eb;
            --border-crystal: rgba(255, 215, 0, 0.45);
            --glass-bg: rgba(18, 12, 28, 0.65);
            --glass-card: rgba(25, 18, 38, 0.60);
            --primary-blue: #2563eb;
            --danger-red: #dc2626;
            --success-green: #16a34a;
        }

        /* 1. الخلفية السينمائية الرومانسية الشفافة والمتكاملة */
        body {
            margin: 0;
            padding: 0;
            direction: rtl;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            background-color: #0d0914;
            /* خلفية سينمائية تضمن ظهور صورة الشاب والفتاة بأجواء رومانسية كريستالية */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.15), transparent 70%),
                linear-gradient(rgba(10, 6, 18, 0.55), rgba(10, 6, 18, 0.75)),
                url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1920&auto=format&fit=crop');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }

        /* التأثير الكريستالي الشفاف (Glassmorphism) */
        .glass-panel {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-crystal);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* الواجهة الخارجية (Splash Screen) */
        #splashScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            background: rgba(8, 5, 14, 0.45);
        }
        .splash-card {
            background: rgba(22, 14, 34, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-crystal);
            border-radius: 20px;
            padding: 30px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        .splash-logo { font-size: 60px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
        .splash-title { color: var(--gold); font-size: 19px; font-weight: bold; margin-bottom: 10px; line-height: 1.4; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        .splash-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }

        /* الأزرار التفاعلية */
        .btn-main {
            background: var(--gold);
            color: #000000;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(255,215,0,0.25);
            transition: all 0.2s ease;
        }
        .btn-main:active { transform: scale(0.98); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--gold);
            border: 1px solid var(--border-crystal);
        }
        .btn-blue {
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
        }
        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-crystal);
            font-size: 11px;
        }

        /* النوافذ المنبثقة (Modals) */
        .modal-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 3, 10, 0.85);
            backdrop-filter: blur(10px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: rgba(24, 16, 36, 0.92);
            border: 1px solid var(--border-crystal);
            border-radius: 18px;
            padding: 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            box-sizing: border-box;
        }
        .modal-content h3 { color: var(--gold); margin-top: 0; font-size: 17px; }

        /* التطبيق الرئيسي (Main App Platform) */
        #mainApp {
            display: none;
            max-width: 950px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .header-stick {
            background: rgba(12, 8, 20, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-crystal);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-hdr { color: var(--gold); font-size: 13px; font-weight: bold; margin: 0; }
        .nav-tabs-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            background: rgba(20, 14, 32, 0.75);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-bottom: 1px solid var(--border-crystal);
        }
        .tab-btn {
            background: rgba(255,255,255,0.05);
            color: var(--gold);
            border: 1px solid var(--border-crystal);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .tab-btn.active {
            background: var(--gold);
            color: #000;
        }

        /* عناصر بروفايل فيسبوك واللوحات */
        .fb-profile-box {
            background: rgba(22, 14, 34, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 0 0 16px 16px;
            border: 1px solid var(--border-crystal);
            border-top: none;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .fb-cover { height: 200px; background: linear-gradient(135deg, rgba(45,30,65,0.8), rgba(15,10,22,0.9)); position: relative; }
        .fb-avatar-wrap { margin-top: -65px; margin-left: 20px; display: inline-block; }
        .fb-avatar-img {
            width: 115px; height: 115px; border-radius: 50%;
            border: 4px solid rgba(20,14,32,0.9); background: #2a1f38;
            display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--gold);
        }
        .fb-details { display: inline-block; vertical-align: top; margin-top: 10px; padding: 0 15px; }
        .card-box {
            background: rgba(22, 14, 34, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-crystal);
            border-radius: 16px;
            padding: 20px;
            margin: 15px;
        }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 15px; }
        .card-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-crystal);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        input, select, textarea {
            width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px;
            border-radius: 8px; border: 1px solid var(--border-crystal); background: rgba(10,6,16,0.85); color: #fff;
            box-sizing: border-box; font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- الواجهة الخارجية (Splash Screen) -->
    <div id="splashScreen">
        <div class="splash-card">
            <div class="splash-logo">💍</div>
            <div class="splash-title">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</div>
            <div class="splash-subtitle">المنصة الآمنة الأولى عربياً لإدارة العلاقات الجادة والخصوصية السيادية. مرحباً بك في عالم الرومانسية الراقية!</div>

            <button class="btn-main" onclick="openModal('authModal')">تسجيل الدخول / إنشاء حساب جديد</button>
            <button class="btn-main btn-secondary" onclick="enterAsGuest()">تصفح كزائر (تجربة 60 دقيقة يومياً)</button>
            <button class="btn-main btn-blue" onclick="startBiometricAuth()">🎤 التوثيق البايومتري (صوت + سيلفي +1500 كوينز)</button>
            <button class="btn-main btn-outline" onclick="openModal('supportModal')">📞 الاتصال بالإدارة والدعم الفني</button>
        </div>
    </div>

    <!-- نافذة التسجيل والدخول الحقيقية -->
    <div id="authModal" class="modal-wrapper">
        <div class="modal-content">
            <h3>تسجيل الدخول أو حساب جديد في مودة</h3>
            <label>الاسم الكامل أو المعرف (MAWDA-XXXX)</label>
            <input type="text" id="regName" placeholder="أحمد العلي">
            <label>البريد الإلكتروني</label>
            <input type="email" id="regEmail" placeholder="name@example.com">
            <label>كلمة المرور</label>
            <input type="password" id="regPass" placeholder="********">
            <button class="btn-main" onclick="confirmLogin()">دخول وتفعيل الجلسة</button>
            <button class="btn-main btn-secondary" onclick="closeModal('authModal')">إلغاء</button>
        </div>
    </div>

    <!-- نافذة الاتصال بالإدارة والدعم -->
    <div id="supportModal" class="modal-wrapper">
        <div class="modal-content">
            <h3>الدعم الفني والتبليغ السيادي</h3>
            <label>رسالتك أو الشكوى الموجهة للإدارة:</label>
            <textarea id="supportText" rows="3" placeholder="اشرح مشكلتك أو استفسارك..."></textarea>
            <label>إرفاق لقطة شاشة (Screenshot):</label>
            <input type="file" id="supportFile">
            <button class="btn-main" onclick="sendSupportMsg()">إرسال للإدارة فوراً</button>
            <button class="btn-main btn-secondary" onclick="closeModal('supportModal')">إلغاء</button>
        </div>
    </div>

    <!-- المنصة الرئيسية -->
    <div id="mainApp">
        <div class="header-stick">
            <h1 class="brand-hdr">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h1>
            <div style="display:flex; gap:8px; align-items:center;">
                <span id="coinsBadge" style="background:rgba(255,215,0,0.2); color:var(--gold); padding:3px 8px; border-radius:10px; font-size:11px; font-weight:bold;">🪙 500 كوينز</span>
                <button class="tab-btn" onclick="exitToSplash()" style="padding:4px 8px;">خروج</button>
            </div>
        </div>

        <div class="nav-tabs-bar">
            <button class="tab-btn active" onclick="switchSection('profile', event)">بروفايل العضو</button>
            <button class="tab-btn" onclick="switchSection('home', event)">الأقسام الرئيسية</button>
            <button class="tab-btn" onclick="switchSection('stores', event)">المتاجر والاقتصاد</button>
            <button class="tab-btn" onclick="switchSection('ads', event)">الإعلانات المبوبة</button>
            <button class="tab-btn" id="adminBtn" onclick="switchSection('admin', event)" style="display:none;">لوحة الأدمن السيادية</button>
        </div>

        <div id="contentView"></div>
    </div>

    <script>
        let userData = {
            name: "أحمد العلي",
            userId: "MAWDA-10254",
            bio: "تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة | دمشق، سوريا",
            verified: true,
            coins: 500,
            isAdmin: true,
            commission: 0.10,
            maintenance: false,
            chatFrozen: false
        };

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function confirmLogin() {
            const name = document.getElementById('regName').value;
            if(name) userData.name = name;
            closeModal('authModal');
            startApp();
        }

        function enterAsGuest() {
            userData.name = "زائر كريم (تصفح 60 دقيقة)";
            userData.isAdmin = false;
            startApp();
        }

        function startBiometricAuth() {
            if(confirm("هل تريد بدء التوثيق البايومتري المتقدم (بصمة الصوت + الفيديو السيلفي) للحصول على +1500 كوينز وشارة التوثيق الذهبية؟")) {
                userData.verified = true;
                userData.coins += 1500;
                alert("تم التوثيق بنجاح! حصلت على شارة التوثيق الذهبية ✔ ورصيد 1500 كوينز إضافي.");
                startApp();
            }
        }

        function sendSupportMsg() {
            const txt = document.getElementById('supportText').value;
            if(!txt) { alert('اكتب الرسالة أولاً'); return; }
            alert("تم إرسال بلاغك للإدارة بنجاح برقم مرجعي #9021.");
            closeModal('supportModal');
        }

        function startApp() {
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('coinsBadge').innerText = `🪙 ${userData.coins} كوينز`;
            if(userData.isAdmin) document.getElementById('adminBtn').style.display = 'inline-block';
            switchSection('profile');
        }

        function exitToSplash() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('splashScreen').style.display = 'flex';
        }

        function switchSection(sec, e) {
            if(e && e.target) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            }
            const view = document.getElementById('contentView');

            if(sec === 'profile') {
                view.innerHTML = `
                    <div class="fb-profile-box">
                        <div class="fb-cover"></div>
                        <div class="fb-avatar-wrap">
                            <div class="fb-avatar-img">👑</div>
                        </div>
                        <div class="fb-details">
                            <h2 style="margin:5px 0; font-size:18px;">${userData.name} ${userData.verified ? '<span style="color:var(--gold); font-size:12px;">✔ موثق ذهبي</span>' : ''}</h2>
                            <p style="margin:0; font-size:12px; color:var(--text-muted);">${userData.bio}</p>
                            <div style="margin-top:12px; display:flex; gap:8px;">
                                <button class="btn-main" style="width:auto; padding:6px 12px;" onclick="alert('تم إرسال طلب الصداقة')">➕ إضافة صديق</button>
                                <button class="btn-main btn-secondary" style="width:auto; padding:6px 12px;" onclick="prompt('اكتب رسالتك الفورية:')">💬 رسالة خاصة</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-box">
                        <textarea id="postInput" placeholder="ما الذي تفكر به؟ شارك منشورك الآن..." rows="3"></textarea>
                        <button class="btn-main" onclick="publishPost()">نشر المنشور على البروفايل</button>
                    </div>
                    <div id="postsFeed">
                        <div class="card-box">
                            <h4 style="margin:0; font-size:14px; color:var(--gold);">${userData.name}</h4>
                            <p style="font-size:13px; margin:8px 0;">أهلاً بكم في تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة. الخلفية السينمائية الرومانسية والواجهات الكريستالية الشفافة تعمل بنجاح!</p>
                            <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-crystal); padding-top:8px; font-size:12px;">
                                <span style="cursor:pointer;" onclick="this.innerText='❤️ أعجبني (1)'">👍 أعجبني</span>
                                <span style="cursor:pointer;" onclick="prompt('تعليقك:')">💬 تعليق</span>
                                <span style="cursor:pointer;" onclick="alert('تم نسخ الرابط')">↗️ مشاركة</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if(sec === 'home') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">أقسام تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h2>
                        <div class="cards-grid">
                            <div class="card-item">
                                <h3>💍 العلاقات الجادة والزواج</h3>
                                <p style="font-size:12px; color:var(--text-muted);">قسم مخصص للبحث عن شريك الحياة وفق معايير التوافق والجدية التامة.</p>
                                <button class="btn-main" onclick="alert('تم الدخول لقسم العلاقات الجادة والزواج')">دخول القسم</button>
                            </div>
                            <div class="card-item">
                                <h3>🌹 الواجهات الرومانسية</h3>
                                <p style="font-size:12px; color:var(--text-muted);">أجواء دافئة وتجارب تواصل راقية تناسب اللحظات الخاصة.</p>
                                <button class="btn-main" onclick="alert('تم الدخول للواجهات الرومانسية')">دخول القسم</button>
                            </div>
                            <div class="card-item">
                                <h3>🔥 اللحظات الجريئة</h3>
                                <p style="font-size:12px; color:var(--text-muted);">مساحة تفاعلية حرة للمشتركين الباحثين عن إثارة استثنائية.</p>
                                <button class="btn-main" onclick="alert('تم الدخول لقسم اللحظات الجريئة')">استكشاف</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if(sec === 'stores') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">متاجر مودة المتكاملة والاقتصاد الرقمي</h2>
                        <div class="cards-grid">
                            <div class="card-item">
                                <h3>🪙 متجر الكوينز</h3>
                                <p style="font-size:12px; color:var(--text-muted);">شحن رصيد العملات لإرسال الهدايا والتفاعل المباشر.</p>
                                <button class="btn-main" onclick="buyCoins(1000)">شحن 1000 كوينز</button>
                            </div>
                            <div class="card-item">
                                <h3>🛡️ متجر الأوسمة</h3>
                                <p style="font-size:12px; color:var(--text-muted);">شراء أوسمة التميز والنخبة والشارات الذهبية.</p>
                                <button class="btn-main" onclick="alert('تم شراء وسام النخبة')">شراء وسام</button>
                            </div>
                            <div class="card-item">
                                <h3>⚡ الميزات الخاصة</h3>
                                <p style="font-size:12px; color:var(--text-muted);">وضع التخفي، تلوين الاسم الملكي، وإخفاء الرصيد.</p>
                                <button class="btn-main" onclick="alert('تم تفعيل الميزات الخاصة')">تفعيل ميزة</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if(sec === 'ads') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">قسم الإعلانات المبوبة السيادية</h2>
                        <div style="background:rgba(255,215,0,0.08); padding:15px; border-radius:10px; border:1px solid var(--border-crystal);">
                            <h4 style="color:var(--gold); margin:0 0 5px 0;">إعلان مميز (إدارة المنصة)</h4>
                            <p style="margin:0; font-size:12px;">عرض خاص: ترقية الأعضاء الموثقين ومنحهم 5000 كوينز مجاناً لشهر كامل.</p>
                        </div>
                    </div>
                `;
            } else if(sec === 'admin') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">لوحة التحكم السيادية (السوبر أدمن)</h2>
                        <label>تعديل نسبة عمولة المنصة:</label>
                        <input type="number" value="${userData.commission}" step="0.01" id="commVal">
                        <button class="btn-main" onclick="saveComm()">حفظ نسبة العمولة</button>

                        <label style="margin-top:10px; display:block;">الحظر السيادي للأجهزة (Hardware Ban):</label>
                        <input type="text" placeholder="أدخل معرف الجهاز أو الـ IP" id="banIP">
                        <button class="btn-main" style="background:var(--danger-red); color:#fff;" onclick="execBan()">تنفيذ الحظر الفوري</button>
                    </div>
                `;
            }
        }

        function publishPost() {
            const txt = document.getElementById('postInput').value;
            if(!txt) { alert('اكتب نص المنشور أولاً'); return; }
            const feed = document.getElementById('postsFeed');
            const newBox = document.createElement('div');
            newBox.className = 'card-box';
            newBox.innerHTML = `
                <h4 style="margin:0; font-size:14px; color:var(--gold);">${userData.name}</h4>
                <p style="font-size:13px; margin:8px 0;">${txt}</p>
                <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-crystal); padding-top:8px; font-size:12px;">
                    <span style="cursor:pointer;" onclick="this.innerText='❤️ أعجبني (1)'">👍 أعجبني</span>
                    <span style="cursor:pointer;" onclick="prompt('تعليقك:')">💬 تعليق</span>
                    <span style="cursor:pointer;" onclick="alert('تم نسخ الرابط')">↗️ مشاركة</span>
                </div>
            `;
            feed.prepend(newBox);
            document.getElementById('postInput').value = '';
            alert('تم نشر المنشور على بروفايلك بنجاح!');
        }

        function buyCoins(amt) {
            userData.coins += amt;
            document.getElementById('coinsBadge').innerText = `🪙 ${userData.coins} كوينز`;
            alert(`تم شحن ${amt} كوينز بنجاح!`);
        }

        function saveComm() {
            const v = document.getElementById('commVal').value;
            userData.commission = v;
            alert('تم حفظ نسبة العمولة الجديدة بنجاح');
        }

        function execBan() {
            const val = document.getElementById('banIP').value;
            if(!val) { alert('أدخل المعرف أو الـ IP أولاً'); return; }
            alert(`تم الحظر السيادي النهائي للجهاز ${val} بنجاح`);
        }
    </script>
</body>
</html>
