<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
    
    <!-- مكتبات Firebase السحابية الرسمية -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --gold: #ffd700;
            --gold-hover: #e6c200;
            --text-main: #ffffff;
            --text-muted: #e5e7eb;
            --border-crystal: rgba(255, 215, 0, 0.45);
            --glass-card: rgba(22, 14, 34, 0.72);
            --primary-blue: #2563eb;
            --danger-red: #dc2626;
            --success-green: #16a34a;
        }

        body {
            margin: 0;
            padding: 0;
            direction: rtl;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            background-color: #0d0914;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.15), transparent 70%),
                linear-gradient(rgba(10, 6, 18, 0.65), rgba(10, 6, 18, 0.85)),
                url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1920&auto=format&fit=crop');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }

        .glass-panel {
            background: var(--glass-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-crystal);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        #splashScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            background: rgba(8, 5, 14, 0.55);
            backdrop-filter: blur(6px);
        }
        .splash-card {
            background: var(--glass-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-crystal);
            border-radius: 20px;
            padding: 30px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            box-sizing: border-box;
        }
        .splash-logo { font-size: 60px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
        .splash-title { color: var(--gold); font-size: 19px; font-weight: bold; margin-bottom: 10px; line-height: 1.4; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        .splash-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; line-height: 1.6; }

        .btn-main {
            background: var(--gold); color: #000; border: none; padding: 12px 18px;
            border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer;
            width: 100%; margin-bottom: 12px; box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(255,215,0,0.25); transition: all 0.2s;
        }
        .btn-main:hover { background: var(--gold-hover); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--gold); border: 1px solid var(--border-crystal); }
        .btn-blue { background: var(--primary-blue); color: #fff; border: none; }
        .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border-crystal); font-size: 11px; }

        .modal-wrapper {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 3, 10, 0.88); backdrop-filter: blur(10px); z-index: 10000;
            justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;
        }
        .modal-content {
            background: rgba(24, 16, 36, 0.95); border: 1px solid var(--border-crystal);
            border-radius: 18px; padding: 25px; max-width: 420px; width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); box-sizing: border-box; text-align: right;
        }
        .modal-content h3 { color: var(--gold); margin-top: 0; font-size: 17px; }

        #mainApp { display: none; max-width: 950px; margin: 0 auto; padding-bottom: 40px; }
        .header-stick {
            background: rgba(12, 8, 20, 0.9); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-crystal); padding: 12px 18px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        .brand-hdr { color: var(--gold); font-size: 13px; font-weight: bold; margin: 0; }
        .nav-tabs-bar {
            display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
            background: rgba(20, 14, 32, 0.8); backdrop-filter: blur(12px);
            padding: 10px; border-bottom: 1px solid var(--border-crystal);
        }
        .tab-btn {
            background: rgba(255,255,255,0.05); color: var(--gold);
            border: 1px solid var(--border-crystal); padding: 8px 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px;
        }
        .tab-btn.active { background: var(--gold); color: #000; }

        .fb-profile-box {
            background: var(--glass-card); backdrop-filter: blur(16px);
            border-radius: 0 0 16px 16px; border: 1px solid var(--border-crystal); border-top: none;
            margin-bottom: 20px; overflow: hidden;
        }
        .fb-cover { height: 200px; background: linear-gradient(135deg, rgba(45,30,65,0.9), rgba(15,10,22,0.95)); position: relative; }
        .fb-avatar-wrap { margin-top: -65px; margin-left: 20px; display: inline-block; }
        .fb-avatar-img {
            width: 115px; height: 115px; border-radius: 50%; border: 4px solid rgba(20,14,32,0.9);
            background: #2a1f38; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--gold);
        }
        .fb-details { display: inline-block; vertical-align: top; margin-top: 10px; padding: 0 15px; }
        .card-box {
            background: var(--glass-card); backdrop-filter: blur(16px);
            border: 1px solid var(--border-crystal); border-radius: 16px; padding: 20px; margin: 15px;
        }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 15px; }
        .card-item {
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-crystal);
            border-radius: 12px; padding: 16px; text-align: center;
        }
        input, select, textarea {
            width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px;
            border-radius: 8px; border: 1px solid var(--border-crystal); background: rgba(10,6,16,0.85); color: #fff;
            box-sizing: border-box; font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- الواجهة الخارجية المستقلة (Splash Screen) -->
    <div id="splashScreen">
        <div class="splash-card">
            <div class="splash-logo">💍</div>
            <div class="splash-title">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</div>
            <div class="splash-subtitle">المنصة الآمنة الأولى عربياً لإدارة العلاقات الجادة والخصوصية السيادية. مرحباً بك في عالم الرومانسية الراقية!</div>

            <button class="btn-main" onclick="openModal('authModal')">تسجيل الدخول / إنشاء حساب جديد</button>
            <button class="btn-main btn-secondary" onclick="enterAsGuest()">تصفح كزائر (تجربة 60 دقيقة يومياً)</button>
            <button class="btn-main btn-blue" onclick="startBiometricAuth()">🎤 التوثيق البايومتري (صوت + سيلفي +1500 كوينز)</button>
            <button class="btn-main btn-outline" onclick="openModal('supportModal')">📞 الاتصال بالإدارة والدعم الفني</button>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول الحقيقية (Firebase Auth) -->
    <div id="authModal" class="modal-wrapper">
        <div class="modal-content">
            <h3>تسجيل الدخول أو حساب جديد في مودة</h3>
            <label>البريد الإلكتروني</label>
            <input type="email" id="authEmail" placeholder="name@example.com">
            <label>كلمة المرور</label>
            <input type="password" id="authPass" placeholder="********">
            <button class="btn-main" onclick="firebaseLogin()">دخول / إنشاء حساب عبر السحابة</button>
            <button class="btn-main btn-secondary" onclick="closeModal('authModal')">إلغاء</button>
        </div>
    </div>

    <!-- نافذة الدعم الفني -->
    <div id="supportModal" class="modal-wrapper">
        <div class="modal-content">
            <h3>الدعم الفني والتبليغ السيادي</h3>
            <label>رسالتك أو الشكوى للإدارة:</label>
            <textarea id="supportText" rows="3" placeholder="اشرح استفسارك..."></textarea>
            <button class="btn-main" onclick="sendSupportMsg()">إرسال للإدارة فوراً</button>
            <button class="btn-main btn-secondary" onclick="closeModal('supportModal')">إلغاء</button>
        </div>
    </div>

    <!-- المنصة الرئيسية (Main App) -->
    <div id="mainApp">
        <div class="header-stick">
            <h1 class="brand-hdr">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h1>
            <div style="display:flex; gap:8px; align-items:center;">
                <span id="coinsBadge" style="background:rgba(255,215,0,0.2); color:var(--gold); padding:3px 8px; border-radius:10px; font-size:11px; font-weight:bold;">🪙 500 كوينز</span>
                <button class="tab-btn" onclick="firebaseLogout()" style="padding:4px 8px;">خروج</button>
            </div>
        </div>

        <div class="nav-tabs-bar">
            <button class="tab-btn active" onclick="switchSection('profile', event)">بروفايل العضو</button>
            <button class="tab-btn" onclick="switchSection('home', event)">الأقسام الرئيسية</button>
            <button class="tab-btn" onclick="switchSection('stores', event)">المتاجر والاقتصاد</button>
            <button class="tab-btn" onclick="switchSection('ads', event)">الإعلانات المبوبة</button>
            <button class="tab-btn" id="adminBtn" onclick="switchSection('admin', event)" style="display:none;">لوحة الأدمن السيادية</button>
        </div>

        <div id="contentView"></div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بك (استبدلها بالبيانات الفعلية من مشروعك في فايرباس)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForProductionSetup",
            authDomain: "mawda-app-2026.firebaseapp.com",
            projectId: "mawda-app-2026",
            storageBucket: "mawda-app-2026.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcde"
        };

        // تهيئة فايرباس
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // مراقبة حالة المصادقة السحابية حقيقياً
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                startAppPlatform(user.email);
            } else {
                exitToSplash();
            }
        });

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // تسجيل الدخول أو إنشاء حساب حقيقي عبر Firebase Auth
        function firebaseLogin() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;
            if(!email || !pass) { alert('الرجاء إدخال البريد وكلمة المرور'); return; }

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    closeModal('authModal');
                })
                .catch((error) => {
                    auth.createUserWithEmailAndPassword(email, pass)
                        .then((userCredential) => {
                            alert('تم إنشاء حساب جديد سحابياً بنجاح!');
                            closeModal('authModal');
                        })
                        .catch((err) => {
                            alert('خطأ في المصادقة: ' + err.message);
                        });
                });
        }

        function enterAsGuest() {
            currentUser = { email: "زائر كريم (تصفح 60 دقيقة)", uid: "GUEST" };
            startAppPlatform("زائر كريم");
        }

        function firebaseLogout() {
            auth.signOut().then(() => {
                exitToSplash();
            });
        }

        function startBiometricAuth() {
            if(confirm("هل تريد بدء التوثيق البايومتري المتقدم (صوت + فيديو سيلفي) للحصول على +1500 كوينز وشارة التوثيق الذهبية؟")) {
                alert("تم التوثيق بنجاح! حصلت على شارة التوثيق الذهبية ✔ ورصيد 1500 كوينز.");
                document.getElementById('coinsBadge').innerText = `🪙 2000 كوينز`;
            }
        }

        function sendSupportMsg() {
            const txt = document.getElementById('supportText').value;
            if(!txt) { alert('اكتب الرسالة أولاً'); return; }
            alert("تم إرسال بلاغك إلى السوبر أدمن سحابياً بنجاح برقم تذكرة #9021.");
            closeModal('supportModal');
        }

        function startAppPlatform(displayName) {
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            
            // تفعيل لوحة الأدمن إذا كان البريد هو بريدك المالك
            if(displayName && displayName.includes("admin")) {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }
            switchSection('profile');
        }

        function exitToSplash() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('splashScreen').style.display = 'flex';
        }

        function switchSection(sec, e) {
            if(e && e.target) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            }
            const view = document.getElementById('contentView');
            const name = currentUser ? currentUser.email : "أحمد العلي";

            if(sec === 'profile') {
                view.innerHTML = `
                    <div class="fb-profile-box">
                        <div class="fb-cover"></div>
                        <div class="fb-avatar-wrap">
                            <div class="fb-avatar-img">👑</div>
                        </div>
                        <div class="fb-details">
                            <h2 style="margin:5px 0; font-size:18px;">${name} <span style="color:var(--gold); font-size:12px;">✔ موثق ذهبي</span></h2>
                            <p style="margin:0; font-size:12px; color:var(--text-muted);">تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة | دمشق، سوريا</p>
                            <div style="margin-top:12px; display:flex; gap:8px;">
                                <button class="btn-main" style="width:auto; padding:6px 12px;" onclick="alert('تم إرسال طلب الصداقة')">➕ إضافة صديق</button>
                                <button class="btn-main btn-secondary" style="width:auto; padding:6px 12px;" onclick="prompt('رسالتك الفورية:')">💬 مراسلة خاصة</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-box">
                        <textarea id="postInput" placeholder="ما الذي تفكر به؟ شارك منشورك السحابي الآن..." rows="3"></textarea>
                        <button class="btn-main" onclick="publishCloudPost()">نشر المنشور فوراً (سحابياً)</button>
                    </div>
                    <div id="postsFeed">
                        <div class="card-box">
                            <h4 style="margin:0; font-size:14px; color:var(--gold);">إدارة مودة السيادية</h4>
                            <p style="font-size:13px; margin:8px 0;">أهلاً بكم في منصة مودة المرتبطة بقواعد البيانات السحابية الحقيقية. المنصة تعمل بكامل طاقتها وأمانها السيادي!</p>
                            <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border-crystal); padding-top:8px; font-size:12px;">
                                <span style="cursor:pointer;" onclick="this.innerText='❤️ أعجبني (1)'">👍 أعجبني</span>
                                <span style="cursor:pointer;" onclick="prompt('تعليقك:')">💬 تعليق</span>
                                <span style="cursor:pointer;" onclick="alert('تم نسخ الرابط')">↗️ مشاركة</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if(sec === 'home') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">أقسام تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h2>
                        <div class="cards-grid">
                            <div class="card-item">
                                <h3>💍 العلاقات الجادة والزواج</h3>
                                <p style="font-size:12px; color:var(--text-muted);">بحث عن شريك الحياة وفق التوافق والجدية التامة.</p>
                                <button class="btn-main" onclick="alert('الدخول لقسم العلاقات الجادة والزواج')">دخول القسم</button>
                            </div>
                            <div class="card-item">
                                <h3>🌹 الواجهات الرومانسية</h3>
                                <p style="font-size:12px; color:var(--text-muted);">أجواء دافئة وتجارب تواصل راقية.</p>
                                <button class="btn-main" onclick="alert('الدخول للواجهات الرومانسية')">دخول القسم</button>
                            </div>
                            <div class="card-item">
                                <h3>🔥 اللحظات الجريئة</h3>
                                <p style="font-size:12px; color:var(--text-muted);">مساحة تفاعلية حرة للمشتركين.</p>
                                <button class="btn-main" onclick="alert('الدخول لقسم اللحظات الجريئة')">استكشاف</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if(sec === 'stores') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">متاجر مودة المتكاملة والاقتصاد الرقمي</h2>
                        <div class="cards-grid">
                            <div class="card-item">
                                <h3>🪙 متجر الكوينز</h3>
                                <p style="font-size:12px; color:var(--text-muted);">شحن رصيد العملات الافتراضية.</p>
                                <button class="btn-main" onclick="alert('شحن 1000 كوينز')">شحن كوينز</button>
                            </div>
                            <div class="card-item">
                                <h3>🛡️ متجر الأوسمة</h3>
                                <p style="font-size:12px; color:var(--text-muted);">أوسمة التميز والنخبة.</p>
                                <button class="btn-main" onclick="alert('شراء وسام النخبة')">شراء وسام</button>
                            </div>
                            <div class="card-item">
                                <h3>⚡ الميزات الخاصة</h3>
                                <p style="font-size:12px; color:var(--text-muted);">وضع التخفي وتلوين الاسم.</p>
                                <button class="btn-main" onclick="alert('تفعيل الميزة الخاصة')">تفعيل ميزة</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if(sec === 'ads') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">قسم الإعلانات المبوبة السيادية</h2>
                        <div style="background:rgba(255,215,0,0.08); padding:15px; border-radius:10px; border:1px solid var(--border-crystal);">
                            <h4 style="color:var(--gold); margin:0 0 5px 0;">إعلان مميز (إدارة المنصة)</h4>
                            <p style="margin:0; font-size:12px;">عرض خاص: ترقية الأعضاء الموثقين ومنحهم 5000 كوينز مجاناً.</p>
                        </div>
                    </div>
                `;
            } else if(sec === 'admin') {
                view.innerHTML = `
                    <div class="card-box">
                        <h2 style="color:var(--gold); font-size:17px; margin-top:0;">لوحة التحكم السيادية (السوبر أدمن)</h2>
                        <label>نسبة عمولة المنصة:</label>
                        <input type="number" value="0.10" step="0.01">
                        <button class="btn-main" onclick="alert('تم حفظ العمولة سحابياً')">حفظ نسبة العمولة</button>

                        <label style="margin-top:10px; display:block;">الحظر السيادي للأجهزة (Hardware Ban):</label>
                        <input type="text" placeholder="معرف المستخدم أو الـ IP">
                        <button class="btn-main" style="background:var(--danger-red); color:#fff;" onclick="alert('تم تنفيذ الحظر السيادي النهائي')">تنفيذ الحظر الفوري</button>
                    </div>
                `;
            }
        }

        function publishCloudPost() {
            const txt = document.getElementById('postInput').value;
            if(!txt) { alert('اكتب نص المنشور أولاً'); return; }
            
            // حفظ المنشور في قاعدة بيانات Firestore الحقيقية
            db.collection("posts").add({
                text: txt,
                author: currentUser ? currentUser.email : "أحمد العلي",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('تم نشر المنشور سحابياً بنجاح ليراه جميع زوار المنصة!');
                document.getElementById('postInput').value = '';
            }).catch((error) => {
                alert('خطأ في النشر السحابي: ' + error.message);
            });
        }
    </script>
</body>
</html>
