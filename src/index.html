<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
    <style>
        :root {
            --glass-bg: rgba(15, 13, 20, 0.78);
            --gold: #ffd700;
            --gold-hover: #e6c200;
            --text-main: #f3f4f6;
            --text-muted: #d1d5db;
            --border-gold: rgba(255, 215, 0, 0.35);
            --primary-blue: #2563eb;
            --danger-red: #dc2626;
        }

        /* الخلفية السينمائية الحميمية والرومانسية الثابتة */
        body {
            background: linear-gradient(rgba(10, 8, 14, 0.82), rgba(10, 8, 14, 0.90)), 
                        url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        /* الواجهة الخارجية (Splash & Auth) */
        #splashScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            background: rgba(10, 8, 14, 0.85);
        }
        .splash-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }
        .splash-logo { font-size: 60px; margin-bottom: 10px; }
        .splash-title { color: var(--gold); font-size: 20px; font-weight: bold; margin-bottom: 8px; line-height: 1.4; }
        .splash-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; line-height: 1.6; }

            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
