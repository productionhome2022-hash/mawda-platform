<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
    <style>
        body {
            background-color: #0b090a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        .app-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ffd700;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        button {
            background: #ffd700;
            color: #0b090a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button.outline {
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
        }
        .card-panel {
            background: rgba(20, 18, 20, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: right;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</h1>
        <p>منصة آمنة وجادة لإدارة العلاقات وتوفير تجربة متكاملة وفق أحدث المعايير.</p>
        
        <div class="nav-buttons">
            <button id="btnHome">الرئيسية</button>
            <button id="btnAdmin" class="outline">لوحة التحكم (الأدمن)</button>
        </div>
        
        <div id="mainView"></div>
    </div>

    <script>
        const mainView = document.getElementById('mainView');
        const btnHome = document.getElementById('btnHome');
        const btnAdmin = document.getElementById('btnAdmin');

        function loadHome() {
            mainView.innerHTML = `
                <div class="card-panel">
                    <h2 style="color: #ffd700; margin-bottom: 10px; font-size: 18px;">قائمة الأعضاء النشطين</h2>
                    <p>يتم إدارة الإعلانات وقسم الأعضاء حصرياً بواسطة مالك التطبيق (الأدمن) لضمان الأمان والخصوصية التامة.</p>
                    <div style="padding: 12px; background: rgba(255,215,0,0.05); border-radius: 6px; border: 1px solid rgba(255,215,0,0.2);">
                        <p style="margin: 0; color: #ddd;">🔹 نظام التصفح والدردشة الآمن يعمل بكفاءة عالية.</p>
                    </div>
                </div>
            `;
        }

        function loadAdmin() {
            mainView.innerHTML = `
                <div class="card-panel">
                    <h2 style="color: #ffd700; margin-bottom: 10px; font-size: 18px;">لوحة التحكم السيادية - تطبيق مودة</h2>
                    <p>إدارة النظام التشغيلي، عمولات المنصة، والتحكم الشامل بالأعضاء.</p>
                    
                    <div style="margin-bottom: 15px;">
                        <label style="font-size: 13px; color: #ccc;">إدارة عمولة المنصة:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" id="commInput" step="0.01" value="0.10">
                            <button id="saveCommBtn" style="height: 41px; margin-top: 8px;">حفظ</button>
                        </div>
                    </div>

                    <div>
                        <label style="font-size: 13px; color: #ccc;">الاستعلام السيادي عن عضو:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="searchInp" placeholder="MAWDA-XXXX">
                            <button id="searchBtn" style="height: 41px; margin-top: 8px;">بحث</button>
                        </div>
                        <div id="searchRes" style="margin-top: 10px;"></div>
                    </div>
                </div>
            `;

            document.getElementById('saveCommBtn').addEventListener('click', () => {
                const val = document.getElementById('commInput').value;
                alert("تم تحديث عمولة المنصة بنجاح إلى: " + val);
            });

            document.getElementById('searchBtn').addEventListener('click', () => {
                const id = document.getElementById('searchInp').value.trim();
                if(!id) { alert("الرجاء إدخال المعرف"); return; }
                document.getElementById('searchRes').innerHTML = `
                    <div style="padding: 10px; background: rgba(0,0,0,0.3); border-radius: 6px; border: 1px solid #444;">
                        <p style="margin: 0 0 5px 0;">المعرف: ${id}</p>
                        <p style="margin: 0 0 8px 0; color: #4ade80;">الحالة: نشط ✅</p>
                        <button onclick="alert('تم حظر العضو بنجاح')" style="background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 4px; border:none; cursor:pointer;">حظر سيادي</button>
                    </div>
                `;
            });
        }

        btnHome.addEventListener('click', loadHome);
        btnAdmin.addEventListener('click', loadAdmin);

        // تحميل الصفحة الرئيسية افتراضياً عند الدخول
        loadHome();
    </script>
</body>
</html>
