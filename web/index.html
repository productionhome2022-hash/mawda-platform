<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>تطبيق مودة للتعارف والدردشة والزواج والعلاقات الجادة</title>
  
  <!-- ربط ملف التكوين للـ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مودة">

  <!-- الخطوط العربية والأنماط التمهيدية -->
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loader-container {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #4f46e5;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-container" id="loading">
    <div class="spinner"></div>
    <h3>جاري تحميل منصة مودة...</h3>
  </div>

  <script>
    // تسجيل معالج الخدمة (Service Worker) لتفعيل الـ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker registered successfully: ', reg.scope))
          .catch((err) => console.log('Service Worker registration failed: ', err));
      });
    }
  </script>

  <!-- ملف تشغيل فلاتر الأساسي للويب -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
